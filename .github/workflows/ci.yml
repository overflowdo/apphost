# Statische Prüfungen für jeden Push und Pull Request.
#
# Fängt genau die Klasse von Fehlern, die in diesem Repo mehrfach durchgerutscht
# ist: eine Compose-Datei, die sich nicht mehr rendern lässt, ein Shell-Skript
# mit einem Tippfehler im Pfad, eine YAML-Datei mit einem überzähligen
# Anführungszeichen, eine Nix-Datei, die nicht evaluiert.
name: CI

on:
  # Nur main im Push-Trigger: sonst laufen für jeden Branch mit offenem PR alle
  # Jobs doppelt (einmal push, einmal pull_request) – das war der Grund für
  # "6 failing, 2 successful checks" bei nur vier Jobs.
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  compose:
    name: docker compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Platzhalter-.env und Secret-Dateien anlegen
        # Die echten Werte stehen nie im Repo; für "config" genügen Attrappen.
        # Fehlen die per Bind-Mount eingehängten Secret-Dateien, bricht compose
        # mit "env file not found" ab.
        run: |
          set -euo pipefail
          sed -e 's/^\(PAPERLESS_REDIS_PASSWORD\)=.*/\1=ci/' .env.example > .env
          {
            echo "CF_DNS_API_TOKEN=ci"
            echo "IMMICH_DB_PASSWORD=ci"
            echo "IMMICH_JWT_SECRET=ci"
            echo "PAPERLESS_SECRET_KEY=ci"
            echo "PAPERLESS_REDIS_PASSWORD=ci"
            echo "OPENCLOUD_ADMIN_PASSWORD=ci"
            echo "COLLABORA_ADMIN_PASSWORD=ci"
            echo "GRAFANA_ADMIN_PASSWORD=ci"
            echo "GRAFANA_SECRET_KEY=ci"
            echo "VAULTWARDEN_ADMIN_TOKEN=ci"
          } >> .env
          mkdir -p secrets
          touch secrets/authelia.env secrets/authelia_oidc_jwks.pem \
                secrets/authelia_users.yml secrets/ntfy.env \
                secrets/alertmanager_ntfy_password secrets/radicale_users \
                secrets/oidc-grafana.env secrets/oidc-paperless.env
      - name: Compose-Konfiguration rendern
        run: docker compose config --quiet
      - name: Auf zurückgelassene :latest-Images prüfen
        run: |
          if grep -rn --include='*.yml' -E '^\s*image:.*:latest' compose/ ; then
            echo "::error::Image ohne feste Version gefunden (siehe oben)."
            exit 1
          fi

  shell:
    name: shellcheck
    runs-on: ubuntu-latest
    # Die Skripte enthalten Umlaute und Rahmenzeichen; ohne UTF-8-Locale bricht
    # shellcheck beim Schreiben der Ausgabe ab ("commitBuffer: invalid argument").
    env:
      LC_ALL: C.UTF-8
      LANG: C.UTF-8
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Syntax
        run: |
          set -euo pipefail
          for f in scripts/*.sh nixos/install.sh; do bash -n "$f"; done
          sh -n config/traefik/render.sh
      - name: shellcheck
        # SC1091: eingebundene Dateien (.env) existieren im Checkout nicht.
        run: shellcheck -e SC1091 scripts/*.sh nixos/install.sh config/traefik/render.sh

  yaml:
    name: yamllint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: pip install yamllint
      - name: yamllint
        # config/authelia/configuration.yml ist ein Go-Template, kein reines YAML.
        run: |
          yamllint -d '{extends: relaxed, rules: {line-length: disable, comments: disable, comments-indentation: disable}}' \
            $(git ls-files '*.yml' '*.yaml' | grep -v 'config/authelia/configuration.yml')

  nix:
    name: nix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: "experimental-features = nix-command flakes"
      - name: Maschinenspezifische Platzhalter erzeugen
        # Diese drei Dateien erzeugt nixos/install.sh pro Installation und sind
        # gitignored. hardware-configuration.nix MUSS dabei leer bleiben:
        # fileSystems kommt aus nixos/disko.nix und die Plattform aus
        # nixosSystem { system = ...; } – ein Platzhalter, der beides selbst
        # setzt, kollidiert damit und war der Grund, warum dieser Job rot war.
        run: |
          set -euo pipefail
          cat > nixos/hardware-configuration.nix <<'NIXEOF'
          { modulesPath, ... }:
          { imports = [ (modulesPath + "/installer/scan/not-detected.nix") ]; }
          NIXEOF
          echo '[ "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAICIexampleexampleexampleexampleexampleexampl ci@example" ]' > nixos/ssh-key.nix
          echo 'false' > nixos/disk-encryption.nix
      - name: Syntax aller Nix-Dateien
        # Harte Schranke: parst jede .nix-Datei, ohne nixpkgs zu laden. Fängt
        # fehlende Klammern, kaputte ''-Strings und Syntaxfehler.
        run: |
          set -euo pipefail
          for f in $(git ls-files '*.nix'); do
            nix-instantiate --parse "$f" > /dev/null
          done
          echo "Alle $(git ls-files '*.nix' | wc -l) Nix-Dateien parsen sauber."
      - name: Konfiguration evaluieren (informativ)
        # Weiche Schranke: wertet die komplette NixOS-Konfiguration aus und
        # findet damit auch falsche Options-Namen und Typfehler. Bewusst mit
        # continue-on-error, weil das Ergebnis von den Flake-Inputs (nixpkgs,
        # disko, lanzaboote) und deren Versionssprüngen abhängt – ein aus
        # diesem Grund dauerrot stehender Pflicht-Job führt nur dazu, dass die
        # CI insgesamt ignoriert wird. Steht der Schritt dauerhaft grün, kann
        # continue-on-error entfallen.
        continue-on-error: true
        run: nix flake check --no-build

  configs:
    name: Dienst-Konfigurationen
    runs-on: ubuntu-latest
    # yamllint prüft nur Syntax. Genau in diesen vier Dateien steckten die
    # Fehler der letzten Runden (Prometheus-Label, Alertmanager-Token,
    # ntfy-Anführungszeichen, Alloy-Quellen) – die fängt erst das Werkzeug des
    # jeweiligen Dienstes. Alle vier laufen als Einzeiler im passenden Image.
    steps:
      - uses: actions/checkout@v7
      - name: promtool (Prometheus-Regeln und -Konfiguration)
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD/config/prometheus:/etc/prometheus:ro" \
            --entrypoint promtool prom/prometheus:v3.12.0 \
            check rules /etc/prometheus/rules/alerts.yml
          docker run --rm -v "$PWD/config/prometheus:/etc/prometheus:ro" \
            --entrypoint promtool prom/prometheus:v3.12.0 \
            check config /etc/prometheus/prometheus.yml
      - name: amtool (Alertmanager)
        run: |
          set -euo pipefail
          # basic_auth.password_file muss existieren, sonst bemängelt amtool
          # die fehlende Datei statt der Konfiguration.
          mkdir -p ci-secrets && echo dummy > ci-secrets/ntfy_password
          docker run --rm \
            -v "$PWD/config/alertmanager:/etc/alertmanager:ro" \
            -v "$PWD/ci-secrets/ntfy_password:/run/secrets/ntfy_password:ro" \
            --entrypoint amtool prom/alertmanager:v0.32.1 \
            check-config /etc/alertmanager/config.yml
      - name: ContainerDown-Regeln gegen den Stack abgleichen
        # config/prometheus/rules/alerts.yml hat je erwartetem Container eine
        # absent()-Regel. Diese Liste läuft ohne Abgleich zwangsläufig
        # auseinander: ein neuer Dienst ohne Regel wird nie vermisst, ein
        # entfernter Dienst alarmiert für immer.
        run: |
          set -euo pipefail
          sed -e 's/^\(PAPERLESS_REDIS_PASSWORD\)=.*/\1=ci/' .env.example > .env
          {
            echo "CF_DNS_API_TOKEN=ci"; echo "IMMICH_DB_PASSWORD=ci"
            echo "IMMICH_JWT_SECRET=ci"; echo "PAPERLESS_SECRET_KEY=ci"
            echo "PAPERLESS_REDIS_PASSWORD=ci"; echo "OPENCLOUD_ADMIN_PASSWORD=ci"
            echo "COLLABORA_ADMIN_PASSWORD=ci"; echo "GRAFANA_ADMIN_PASSWORD=ci"
            echo "GRAFANA_SECRET_KEY=ci"; echo "VAULTWARDEN_ADMIN_TOKEN=ci"
          } >> .env
          mkdir -p secrets
          touch secrets/authelia.env secrets/authelia_oidc_jwks.pem \
                secrets/authelia_users.yml secrets/ntfy.env \
                secrets/alertmanager_ntfy_password secrets/radicale_users \
                secrets/oidc-grafana.env secrets/oidc-paperless.env
          docker compose config > /tmp/rendered.yml
          python3 - <<'PYEOF'
          import re, yaml
          rendered = yaml.safe_load(open("/tmp/rendered.yml"))
          # Alles ausser den Einmal-Containern (restart: "no").
          erwartet = {
              svc.get("container_name", name)
              for name, svc in rendered["services"].items()
              if svc.get("restart") not in (None, "no")
          }
          regeln = set(re.findall(
              r'absent\(container_last_seen\{name="([^"]+)"\}\)',
              open("config/prometheus/rules/alerts.yml").read()))
          fehlend, ueberzaehlig = erwartet - regeln, regeln - erwartet
          if fehlend:
              print("::error::Kein ContainerDown-Alert fuer:", ", ".join(sorted(fehlend)))
          if ueberzaehlig:
              print("::error::Alert fuer nicht (mehr) vorhandene Container:",
                    ", ".join(sorted(ueberzaehlig)))
          if fehlend or ueberzaehlig:
              raise SystemExit(1)
          print(f"{len(regeln)} ContainerDown-Regeln, deckungsgleich mit dem Stack.")
          PYEOF
      - name: Startphasen gegen den Stack abgleichen
        # scripts/stack-up.sh (Alias `up`) startet Dienste namentlich in
        # Phasen. Steht ein Dienst in der include-Liste, aber in keiner Phase,
        # startet ihn niemand – der Container existiert schlicht nicht, das
        # Dashboard zeigt einen roten Punkt und Traefik ein 404, weil es ohne
        # Container keinen Router gibt. Genau so war backup-trigger monatelang
        # tot. Von Hand faellt das nicht auf, weil beide Listen an
        # verschiedenen Stellen liegen.
        run: |
          set -euo pipefail
          docker compose config > /tmp/rendered.yml
          python3 - <<'PYEOF'
          import re, yaml
          rendered = yaml.safe_load(open("/tmp/rendered.yml"))["services"]
          dauerhaft = {n for n, s in rendered.items() if s.get("restart") not in (None, "no")}
          phasen = set()
          for m in re.finditer(r'^phase\s+"[^"]*"\s+(.*)$',
                               open("scripts/stack-up.sh").read(), re.M):
              phasen |= set(m.group(1).split())
          # Was per depends_on mitkommt, muss nicht in einer Phase stehen
          # (socket-proxy haengt an Traefik, die *-init-Container an ihren
          # Diensten). Huelle bilden, bis nichts Neues mehr dazukommt.
          erreichbar = set(phasen)
          while True:
              neu = {d for n in erreichbar if n in rendered
                       for d in (rendered[n].get("depends_on") or {})}
              if neu <= erreichbar:
                  break
              erreichbar |= neu
          nie = dauerhaft - erreichbar
          tippfehler = phasen - set(rendered)
          if nie:
              print("::error::Wird von `up` nie gestartet:", ", ".join(sorted(nie)))
          if tippfehler:
              print("::error::In stack-up.sh genannt, aber kein Dienst:",
                    ", ".join(sorted(tippfehler)))
          if nie or tippfehler:
              raise SystemExit(1)
          print(f"{len(dauerhaft)} dauerhafte Dienste, alle von `up` erreicht.")
          PYEOF
      - name: alloy fmt (Syntaxprüfung)
        # Bewusst OHNE --test: das schlägt auch bei reinen Formatierungs-
        # unterschieden fehl (Einrückung, Ausrichtung der =). Uns interessiert
        # hier nur, ob die Datei syntaktisch gültig ist – und genau daran
        # scheitert `fmt` ebenfalls, nur ohne kosmetische Fehlalarme.
        run: |
          docker run --rm -v "$PWD/config/alloy:/etc/alloy:ro" \
            grafana/alloy:v1.18.0 fmt /etc/alloy/config.alloy > /dev/null
      # ACHTUNG bei Alloy-Updates: Renovate zieht diese Zeile NICHT mit.
      # Der docker-compose-Manager greift nur in compose/, und ein `docker run`
      # in einem run:-Schritt parst kein Manager. Version muss zu
      # compose/monitoring/exporters.yml passen, sonst prueft die CI gegen
      # eine andere Alloy-Version als die, die laeuft.
      # authelia validate-config fehlt hier bewusst: config/authelia/configuration.yml
      # ist ein Go-Template ({{ env ... }}) und braucht zum Parsen
      # X_AUTHELIA_CONFIG_FILTERS=template, rund acht Umgebungsvariablen UND die
      # OIDC-Schlüsseldatei. Das in der CI nachzubauen erzeugt mehr Fehlerquellen,
      # als es fängt.
