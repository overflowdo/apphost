# AppHost – Haupt-Einstiegspunkt
name: apphost

networks:
  traefik-public:
    name: traefik-public
    driver: bridge
    ipam:
      config:
        - subnet: 172.23.0.0/16
  socket-proxy:
    name: socket-proxy
    driver: bridge
  monitoring-network:
    name: monitoring-network
    driver: bridge
  communication-network:
    name: communication-network
    driver: bridge
  media-network:
    name: media-network
    driver: bridge
  cloud-network:
    name: cloud-network
    driver: bridge
  documents-network:
    name: documents-network
    driver: bridge
  # Dienste, die dem Remote-User-Header von Authelia vertrauen, gehoeren NICHT
  # in das flache traefik-public: dort haengen ~20 Container, und jeder koennte
  # den Header direkt am Dienst vorbei an Traefik setzen. In diesem Netz stecken
  # nur Traefik und der jeweilige Dienst.
  sso-header-network:
    name: sso-header-network
    driver: bridge

include:
  # Infrastructure
  - compose/infrastructure/traefik.yml
  - compose/infrastructure/authelia.yml
  - compose/infrastructure/ca-download.yml
  # Media
  - compose/media/jellyfin.yml
  - compose/media/immich.yml
  # Documents
  - compose/documents/paperless.yml
  - compose/documents/bento-pdf.yml
  # Cloud
  - compose/cloud/opencloud.yml
  - compose/cloud/collabora.yml
  # Monitoring
  - compose/monitoring/prometheus.yml
  - compose/monitoring/grafana.yml
  - compose/monitoring/loki.yml
  - compose/monitoring/alertmanager.yml
  - compose/monitoring/exporters.yml
  # Communication
  - compose/communication/ntfy.yml
  - compose/communication/bichon.yml
  # Tools
  - compose/tools/homepage.yml
  - compose/tools/openspeedtest.yml
  - compose/tools/vaultwarden.yml
  - compose/tools/radicale.yml
  - compose/tools/grocy.yml
