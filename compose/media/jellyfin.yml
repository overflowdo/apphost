name: apphost
volumes:
  jellyfin_config: {name: apphost_jellyfin_config}
  jellyfin_cache: {name: apphost_jellyfin_cache}
services:
  jellyfin:
    image: jellyfin/jellyfin:10.11.11@sha256:aefb67e6a7ff1debdd154a78a7bbb780fd0c873d8639210a7f6a2016ad2b35db
    container_name: jellyfin
    restart: unless-stopped
    runtime: runc
    networks:
      traefik-public: {}
    volumes:
      - jellyfin_config:/config
      - jellyfin_cache:/cache
      # Fest /mnt/media wie überall sonst im Stack. Vorher stand hier als
      # EINZIGER Stelle ${MEDIA_DIR:-/mnt/media} – das suggerierte einen frei
      # wählbaren Pfad, den Immich, Paperless, OpenCloud und Radicale gar nicht
      # kennen (die haben /mnt/media hart verdrahtet, ebenso
      # nixos/modules/media-disk.nix und media-dirs.nix). Wer MEDIA_DIR änderte,
      # zerriss den Stack. Der Mountpunkt gehört genau an eine Stelle:
      # nixos/modules/media-disk.nix.
      - /mnt/media/jellyfin:/media:ro
      # Hardware-Transcoding
      # - /dev/dri:/dev/dri
    environment:
      JELLYFIN_PublishedServerUrl: https://jellyfin.${DOMAIN}
      TZ: Europe/Berlin
    user: "1000:1000"
    security_opt: ['no-new-privileges:true']
    cap_drop: [ALL]
    tmpfs:
      - /tmp:size=1g,mode=1777
      - /transcode:size=4g,mode=1777
    deploy:
      resources:
        limits: {cpus: "4.0", memory: 4G}
        reservations: {cpus: "0.25", memory: 512M}
    ulimits:
      nofile: {soft: 65536, hard: 65536}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8096/health || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 60s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.jellyfin.rule=Host(`jellyfin.${DOMAIN}`)"
      - "traefik.http.routers.jellyfin.entrypoints=websecure"
      - "traefik.http.services.jellyfin.loadbalancer.server.port=8096"
      - "traefik.http.routers.jellyfin.middlewares=default-chain@file"
