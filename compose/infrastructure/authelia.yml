name: apphost
volumes:
  authelia_data: {name: apphost_authelia_data}
services:
  authelia:
    image: authelia/authelia:4.38.18@sha256:a5e6fa4b1dbdc296f80f9175157b145a0598690ec8cd4d6e105cd4498fe0c731
    container_name: authelia
    restart: unless-stopped
    runtime: runc
    # Authelias eigenes Entrypoint chownt nur /config, nicht /data.
    # Auf einem frischen (root:root) Volume kann der auf PUID/PGID
    # gedroppte Prozess sonst weder db.sqlite3 noch notification.txt anlegen.
    # Deshalb /data selbst chownen und dann an das Original-Entrypoint übergeben.
    entrypoint: ["/bin/sh", "-c", "chown -R $${PUID:-1000}:$${PGID:-1000} /data && exec /app/entrypoint.sh"]
    networks:
      traefik-public: {}
    volumes:
      - authelia_data:/data
      - ../../config/authelia/configuration.yml:/config/configuration.yml:ro
      - ../../secrets/authelia_users.yml:/config/users_database.yml
      - ../../secrets/authelia_oidc_jwks.pem:/config/oidc_jwks.pem:ro
    env_file:
      - ../../secrets/authelia.env
    environment:
      TZ: Europe/Berlin
      PUID: "1000"
      PGID: "1000"
      X_AUTHELIA_CONFIG_FILTERS: template
      # Für Template-Auflösung in configuration.yml.
      # Nur X_AUTHELIA_* und nicht-AUTHELIA_*-Variablen: alles mit AUTHELIA_-Präfix
      # versucht Authelia auf einen Config-Key zu mappen ("not expected"-Warnung).
      DOMAIN: ${DOMAIN}
      AUTH_SUBDOMAIN: ${AUTHELIA_SUBDOMAIN:-auth}
      GRAFANA_SUBDOMAIN: ${GRAFANA_SUBDOMAIN:-grafana}
      IMMICH_SUBDOMAIN: ${IMMICH_SUBDOMAIN:-photos}
      HOMEPAGE_SUBDOMAIN: ${HOMEPAGE_SUBDOMAIN:-dashboard}
      OPENSPEEDTEST_SUBDOMAIN: ${OPENSPEEDTEST_SUBDOMAIN:-speedtest}
      BICHON_SUBDOMAIN: ${BICHON_SUBDOMAIN:-bichon}
      # Ohne diese Variable stand die Grocy-Regel in der ACL hart auf
      # "grocy.<domain>", während der Router ${GROCY_SUBDOMAIN} benutzt: bei
      # geändertem Subdomain-Namen griff default_policy: deny und Grocy war dicht.
      GROCY_SUBDOMAIN: ${GROCY_SUBDOMAIN:-grocy}
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, SETGID, SETUID]
    tmpfs:
      - /tmp:size=64m,mode=1777
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 256M}
        reservations: {memory: 64M}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9091/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.authelia.rule=Host(`${AUTHELIA_SUBDOMAIN:-auth}.${DOMAIN}`)"
      - "traefik.http.routers.authelia.entrypoints=websecure"
      - "traefik.http.services.authelia.loadbalancer.server.port=9091"
      - "traefik.http.routers.authelia.middlewares=rate-limit@file,in-flight@file,security-headers@file,compress@file"
      # Eigener Router nur für die Anmelde-Endpunkte: dort greift das strenge
      # Limit (5/s), während das Portal selbst (Dutzende Assets) am normalen
      # Limit hängt. Gleiches Muster wie bei vaultwarden-auth.
      # PathPrefix nimmt in Traefik v3 GENAU EIN Argument
      # (pkg/muxer/http/matcher.go: expectNParameters(pathPrefix, 1)). Zwei
      # Argumente lassen das Anlegen des Routers mit "unexpected number of
      # parameters" scheitern – Traefik lädt den Rest normal weiter, und die
      # Anfragen fielen still auf den regulären authelia-Router mit 50/s
      # zurück. Mehrere Pfade brauchen eine Veroderung.
      - "traefik.http.routers.authelia-login.rule=Host(`${AUTHELIA_SUBDOMAIN:-auth}.${DOMAIN}`) && (PathPrefix(`/api/firstfactor`) || PathPrefix(`/api/secondfactor`))"
      - "traefik.http.routers.authelia-login.entrypoints=websecure"
      - "traefik.http.routers.authelia-login.priority=100"
      - "traefik.http.routers.authelia-login.service=authelia"
      - "traefik.http.routers.authelia-login.middlewares=auth-endpoint-chain@file"
      - "homepage.group=Infrastruktur"
      - "homepage.name=Authelia"
      - "homepage.icon=authelia.png"
      - "homepage.href=https://${AUTHELIA_SUBDOMAIN:-auth}.${DOMAIN}"
