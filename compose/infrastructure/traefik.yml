name: apphost
volumes:
  traefik_certs:
    name: apphost_traefik_certs
  traefik_config:
    name: apphost_traefik_config
services:
  # Init-Container: rendert traefik.yml aus dem Template (Platzhalter aus .env)
  # bei jedem Start und beendet sich.
  traefik-init:
    image: traefik:v3.7.12@sha256:9c2a54d87f76f5c2f5f2682c68394af92fb12c0a2686798d6462a3f84bd78eaf
    container_name: traefik-init
    restart: "no"
    runtime: runc
    network_mode: "none"
    entrypoint: ["/bin/sh", "/src/render.sh"]
    volumes:
      - ../../config/traefik:/src:ro
      - traefik_config:/rendered
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
      ACME_DNS_PROVIDER: ${ACME_DNS_PROVIDER}
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 64M}
  socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0@sha256:1f5038b54f06c3e18422902cf00ba21803d1c97805aae032e5e6673d532d3459
    container_name: socket-proxy
    restart: unless-stopped
    runtime: runc
    userns_mode: "host"
    networks:
      - socket-proxy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      CONTAINERS: 1
      NETWORKS: 1
      EVENTS: 1
      PING: 1
      VERSION: 1
      # INFO (GET /info) braucht cAdvisor beim Registrieren seiner Docker-Factory.
      # Ohne das antwortet der Proxy mit 403, cAdvisor läuft zwar weiter, aber ohne
      # Docker-Integration: es bleiben rohe cgroup-Metriken OHNE name= und
      # container_label_*. Alle drei Container-Alerts filtern auf name!="" –
      # ContainerDown (absent(...)) würde dann dauerhaft feuern.
      INFO: 1
      POST: 0
      DELETE: 0
      PUT: 0
      # GRENZE DIESES PROXYS, damit sie niemand überschätzt: er filtert nach
      # HTTP-Methode und Pfadpräfix, nicht nach Endpunkt. Unter CONTAINERS=1
      # sind damit ZWEI Wege offen, und der zweite ist der schlimmere:
      #
      #   GET /containers/{id}/json     liefert .Config.Env – also ALLES, was
      #     per environment: oder env_file: gesetzt ist, im Klartext. Compose
      #     löst env_file clientseitig auf, die Werte stehen im Container-
      #     Objekt. Konkret: AUTHELIA_SESSION_SECRET und
      #     AUTHELIA_STORAGE_ENCRYPTION_KEY, Grafanas Admin-Passwort und
      #     GF_SECURITY_SECRET_KEY, PAPERLESS_SECRET_KEY, Immichs DB-Passwort
      #     und JWT_SECRET, die OIDC-Client-Secrets, OpenCloud-/Collabora-/
      #     ntfy-Passwörter, Vaultwardens Token-Hash.
      #   GET /containers/{id}/archive  liest jede Datei aus jedem Container:
      #     secrets/authelia_oidc_jwks.pem (der RSA-Signierschlüssel – damit
      #     lassen sich OIDC-Token für Grafana, Immich und Paperless fälschen),
      #     Vaultwardens db.sqlite3, Traefiks TLS-Key.
      #
      # Das ist keine offene Tür: es braucht erst eine RCE in einem Container,
      # der im socket-proxy-Netz hängt. Aber es ist der eine Punkt im Stack, an
      # dem ein übernommener Nebendienst sofort alles aufmacht – genau die
      # Eigenschaft, gegen die der Rest der Härtung gebaut ist. Deshalb hängt
      # hier nur noch drin, wer es wirklich braucht: traefik (Labels +
      # Netzwerke), cadvisor und alloy (Container-Discovery, Log-Tailing).
      # Homepage ist bewusst raus, siehe compose/tools/homepage.yml.
      #
      # BEWUSST OFFEN: Ein filternder nginx davor, der /archive sperrt und
      # .Config.Env aus der JSON-Antwort schneidet, wäre die echte Lösung.
      # Dagegen steht, dass Alloys loki.source.docker über dieselbe Verbindung
      # gestreamtes, gemultiplextes HTTP tailt – das durch einen Filter zu
      # schleifen bricht still die Log-Sammlung. Ohne Teststellung nicht
      # anzufassen.
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /run:size=16m,mode=0755
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 64M}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:2375/version"]
      interval: 5s
      timeout: 10s
      retries: 12
    labels:
      - "traefik.enable=false"
  traefik:
    image: traefik:v3.7.12@sha256:9c2a54d87f76f5c2f5f2682c68394af92fb12c0a2686798d6462a3f84bd78eaf
    container_name: traefik
    restart: unless-stopped
    runtime: runc
    depends_on:
      socket-proxy:
        condition: service_healthy
      traefik-init:
        condition: service_completed_successfully
    # Statische Konfiguration aus der vom Init-Container gerenderten Datei lesen.
    # --configFile umgeht die Default-Suche in /etc/traefik; die dortige
    # traefik.template.yml wird dadurch nicht als Config interpretiert.
    command:
      - "--configFile=/rendered/traefik.yml"
    networks:
      traefik-public:
        ipv4_address: 172.23.1.2
      socket-proxy: {}
      # Fuer Dienste, die dem Remote-User-Header vertrauen (aktuell Grocy) und
      # deshalb nicht im flachen traefik-public stehen duerfen.
      sso-header-network: {}
    ports:
      - "80:8081"
      - "443:8443"
      - "443:8443/udp" # HTTP/3 QUIC
    volumes:
      # Zertifikate: named volume (persistent, Traefik erstellt acme.json selbst)
      - traefik_certs:/certs
      # Gerenderte statische Konfiguration (traefik.yml) vom Init-Container
      - traefik_config:/rendered:ro
      # Restliche Konfiguration aus dem Repo (v.a. das dynamische Verzeichnis
      # /etc/traefik/dynamic, auf das der file-Provider zeigt)
      - ../../config/traefik:/etc/traefik:ro
      # Lokale CA + Server-Zertifikat (von nixos/modules/local-ca.nix erzeugt)
      - /var/lib/apphost-ca:/certs-local:ro
      # Access-Log als Datei – Quelle für das fail2ban-Jail "traefik-auth".
      # Verzeichnis + Ownership legt nixos/modules/docker.nix an (tmpfiles).
      - /var/log/traefik:/var/log/traefik
    environment:
      TZ: Europe/Berlin
      # Hetzner:
      HETZNER_API_KEY: ${HETZNER_API_KEY:-}
      # Cloudflare:
      CF_DNS_API_TOKEN: ${CF_DNS_API_TOKEN:-}
      # HINWEIS: Statische Traefik-Optionen (ACME-Email, Domains, DNS-Provider)
      # lassen sich hier NICHT per TRAEFIK_*-Umgebungsvariable setzen: Sobald
      # eine Konfigurationsdatei existiert, ignoriert Traefik alle TRAEFIK_*-
      # Variablen für die statische Konfiguration (die Quellen sind gegenseitig
      # ausschließend). Diese Werte rendert deshalb der traefik-init-Container
      # aus der .env in die traefik.yml. Nur echte Laufzeit-Variablen des
      # DNS-Providers (HETZNER_API_KEY, CF_DNS_API_TOKEN, TZ) gehören hierher.
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    deploy:
      resources:
        limits: {cpus: "2.0", memory: 512M}
        reservations: {cpus: "0.25", memory: 128M}
    ulimits:
      nofile: {soft: 65536, hard: 65536}
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik.rule=Host(`traefik.${DOMAIN}`)"
      - "traefik.http.routers.traefik.entrypoints=websecure"
      - "traefik.http.routers.traefik.service=api@internal"
      - "traefik.http.routers.traefik.middlewares=authelia-chain@file"
