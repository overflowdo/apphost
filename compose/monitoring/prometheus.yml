name: apphost
volumes:
  prometheus_data: {name: apphost_prometheus_data}
services:
  prometheus:
    image: prom/prometheus:v3.14.0@sha256:5ce7540c3c00ef4ab0c9d2c995c6a5b9c421f44b4a115d97a2c7af3b1c21cbb0
    container_name: prometheus
    restart: unless-stopped
    runtime: runc
    networks:
      monitoring-network: {}
      traefik-public: {}
      media-network: {}
    volumes:
      - prometheus_data:/prometheus
      - ../../config/prometheus:/etc/prometheus:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-90d}"
      - "--storage.tsdb.retention.size=50GB"
      # KEIN --web.enable-lifecycle. Der Schalter öffnet POST /-/reload UND
      # POST /-/quit, beide ohne jede Authentifizierung – Prometheus hängt in
      # traefik-public, also könnte jeder Container in diesem Netz das
      # Monitoring abschalten. Gebraucht hat es im Repo nichts (kein Skript,
      # kein Dienst ruft die Endpunkte auf; die Dashboards lesen nur
      # prometheus_config_last_reload_*-Metriken). Preis: eine geänderte
      # prometheus.yml oder Regeldatei wird jetzt mit
      # `docker compose restart prometheus` übernommen statt per Reload.
      - "--no-web.enable-admin-api"
      - "--web.external-url=https://prometheus.${DOMAIN}"
      - "--log.level=warn"
    environment:
      TZ: Europe/Berlin
    user: "65534:65534"
    security_opt: ['no-new-privileges:true']
    cap_drop: [ALL]
    tmpfs:
      - /tmp:size=128m,mode=1777
    deploy:
      resources:
        limits: {cpus: "4.0", memory: 4G}
        reservations: {memory: 512M}
    ulimits:
      nofile: {soft: 65536, hard: 65536}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.prometheus.rule=Host(`prometheus.${DOMAIN}`)"
      - "traefik.http.routers.prometheus.entrypoints=websecure"
      - "traefik.http.services.prometheus.loadbalancer.server.port=9090"
      - "traefik.http.routers.prometheus.middlewares=authelia-chain@file"
