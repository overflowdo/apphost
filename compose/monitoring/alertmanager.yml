name: apphost
volumes:
  alertmanager_data: {name: apphost_alertmanager_data}
services:
  alertmanager:
    image: prom/alertmanager:v0.34.1@sha256:e9733bafb1bdef9b00e25a21f8f99dc26a22224bf16641ad754d1649f4c3357a
    container_name: alertmanager
    restart: unless-stopped
    runtime: runc
    networks:
      monitoring-network: {}
      traefik-public: {}
      communication-network: {}
    volumes:
      - alertmanager_data:/alertmanager
      - ../../config/alertmanager:/etc/alertmanager:ro
      # ntfy-Passwort für die Webhook-Receiver (config/alertmanager/config.yml
      # -> basic_auth.password_file). Erzeugt von scripts/update-secrets-ntfy.sh.
      - ../../secrets/alertmanager_ntfy_password:/run/secrets/ntfy_password:ro
    command:
      - "--config.file=/etc/alertmanager/config.yml"
      - "--storage.path=/alertmanager"
      - "--web.external-url=https://alertmanager.${DOMAIN}"
      - "--log.level=warn"
    user: "65534:65534"
    security_opt: ['no-new-privileges:true']
    cap_drop: [ALL]
    tmpfs:
      - /tmp:size=64m,mode=1777
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 128M}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9093/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.alertmanager.rule=Host(`alertmanager.${DOMAIN}`)"
      - "traefik.http.routers.alertmanager.entrypoints=websecure"
      - "traefik.http.services.alertmanager.loadbalancer.server.port=9093"
      - "traefik.http.routers.alertmanager.middlewares=authelia-chain@file"
