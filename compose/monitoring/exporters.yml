name: apphost
services:
  node-exporter:
    image: prom/node-exporter:v1.12.1@sha256:1b4e4438faca4dd7e001dd445d161a4a2091b0fededa84093b3a8dfeae1f1be0
    container_name: node-exporter
    restart: unless-stopped
    runtime: runc
    network_mode: host
    userns_mode: "host"
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
      # Textfile-Collector: hier legt scripts/media-backup.sh den Zeitpunkt des
      # letzten erfolgreichen Backups je Wechselplatte ab. Nur lesend – der
      # Container schreibt nichts (read_only: true steht unten ohnehin).
      # Verzeichnis + Rechte legt nixos/modules/backup.nix per tmpfiles an.
      - /var/lib/node-exporter/textfile:/textfile:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
      # Ohne das gäbe es keinen Weg, einen Zustand aus der VM (Backup-Alter) in
      # Prometheus zu bekommen, den nicht irgendein Dienst selbst exportiert.
      - "--collector.textfile.directory=/textfile"
    security_opt: ['no-new-privileges:true']
    cap_drop: [ALL]
    read_only: true
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 64M}
    # prom/node-exporter basiert auf busybox -> wget ist vorhanden.
    # (loki ist dagegen distroless und alloy ein Ubuntu ohne wget/curl: dort ist
    # ein exec-Healthcheck technisch unmöglich. Beide deckt stattdessen der
    # TargetDown-Alert über die Prometheus-up-Metrik ab.)
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9100/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    labels:
      - "traefik.enable=false"
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.55.1@sha256:3de2bd5203120b866d74a9b283b2ffb8ec382fbf9dc321814700c6ea6f44ec57
    container_name: cadvisor
    restart: unless-stopped
    runtime: runc
    # socket-proxy statt Docker-Socket: früher lag hier /var/run:/var/run:ro,
    # was den docker.sock mit einschloss. Das ":ro" wirkt nur auf den Mount,
    # nicht auf das Protokoll – der Container hatte damit volle Docker-API und
    # hätte sich per privilegiertem Container mit /-Mount Host-Root holen können.
    # Der socket-proxy erlaubt nur GET (POST=0), damit ist genau das ausgeschlossen.
    networks: [monitoring-network, socket-proxy]
    depends_on:
      socket-proxy:
        condition: service_healthy
    # Kein "privileged: true" mehr: cAdvisor braucht davon nur /dev/kmsg, und das
    # wird unten gezielt durchgereicht. Mit privileged war zusätzlich
    # no-new-privileges wirkungslos.
    userns_mode: "host"
    command:
      - "--docker=tcp://socket-proxy:2375"
    # KEIN /:/rootfs:ro. Zusammen mit userns_mode: "host" (echter Host-Root) und
    # CAP_DAC_READ_SEARCH – das laut capabilities(7) jede Datei-Leseprüfung
    # umgeht – war damit der komplette Host lesbar: /opt/monorepo/.env (0600
    # apphost, alle Klartext-Passwörter), /opt/monorepo/secrets/ (0700),
    # /etc/shadow. Für einen Metrik-Container ist das nicht zu rechtfertigen.
    # Gebraucht wird der Mount hier nicht: er speist machine_* und
    # container_fs_*, und die nutzt weder ein Dashboard noch eine Alert-Regel
    # (alle Platzangaben kommen aus node_filesystem_* vom node-exporter, der
    # /rootfs behält, dafür aber keine Zusatz-Capability hat). Die vier
    # Container-Alerts hängen an container_last_seen, das Dashboard an
    # container_cpu_*/memory_*/network_* – alles aus cgroups + Docker-API.
    # cAdvisor kommt ohne den Mount sauber hoch: manager.New() prüft
    # os.Stat("/rootfs/proc") und setzt bei Abwesenheit inHostNamespace = true,
    # womit machine.Info() /proc/cpuinfo direkt liest statt /rootfs/proc/cpuinfo
    # (cadvisor v0.54.1, manager/manager.go:185-187, machine/info.go:57-63).
    volumes:
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    devices:
      - /dev/kmsg
    security_opt: ['no-new-privileges:true']
    # cap_drop fehlte hier als einzigem Container neben alloy: cAdvisor lief als
    # echter Host-Root mit dem vollen Docker-Default-Capability-Satz.
    # DAC_READ_SEARCH bleibt als einzige, weil das Traversieren von
    # /var/lib/docker (0710) und /dev/kmsg sonst scheitert; DAC_OVERRIDE
    # (Schreibrechte) braucht es nicht.
    # EHRLICH ZUM REST-RISIKO: DAC_READ_SEARCH + /var/lib/docker:ro heißt, dass
    # dieser Container weiterhin jede Datei unterhalb des Docker-Datenverzeichnisses
    # lesen kann – also auch Volumes wie Vaultwardens db.sqlite3. Was nicht mehr
    # geht, ist der Rest des Hosts. Enger würde es nur ohne /var/lib/docker,
    # dann fehlt cAdvisor die Zuordnung der Container-Dateisysteme.
    cap_drop: [ALL]
    cap_add: [DAC_READ_SEARCH]
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 256M}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - "traefik.enable=false"
  # redis_exporter für die immich-Valkey-Instanz (ohne Passwort, media-network)
  immich-redis-exporter:
    image: oliver006/redis_exporter:v1.88.0-alpine@sha256:db6df2026585151c2209aa1f21c8856da883cf933b0943c0e51d1f4b3acf1a8d
    container_name: immich-redis-exporter
    restart: unless-stopped
    runtime: runc
    networks: [media-network, monitoring-network]
    environment:
      REDIS_ADDR: redis://immich-redis:6379
      TZ: Europe/Berlin
    user: "65534:65534"
    security_opt: ['no-new-privileges:true']
    cap_drop: [ALL]
    read_only: true
    deploy:
      resources:
        limits: {cpus: "0.25", memory: 64M}
    labels:
      - "traefik.enable=false"
  # redis_exporter für die paperless-Valkey-Instanz (Passwort, documents-network)
  paperless-redis-exporter:
    image: oliver006/redis_exporter:v1.88.0-alpine@sha256:db6df2026585151c2209aa1f21c8856da883cf933b0943c0e51d1f4b3acf1a8d
    container_name: paperless-redis-exporter
    restart: unless-stopped
    runtime: runc
    networks: [documents-network, monitoring-network]
    environment:
      REDIS_ADDR: redis://paperless-redis:6379
      REDIS_PASSWORD: ${PAPERLESS_REDIS_PASSWORD:?}
      TZ: Europe/Berlin
    user: "65534:65534"
    security_opt: ['no-new-privileges:true']
    cap_drop: [ALL]
    read_only: true
    deploy:
      resources:
        limits: {cpus: "0.25", memory: 64M}
    labels:
      - "traefik.enable=false"
  alloy:
    image: grafana/alloy:v1.18.0@sha256:491b0578c04983fd54fe99b587b6fab4404dc46d0dc16677bd6b00cc1140b308
    container_name: alloy
    restart: unless-stopped
    runtime: runc
    # Wie cAdvisor: kein /run/docker.sock mehr (":ro" schützt einen Unix-Socket
    # nicht – das war voller Docker-API-Zugriff und damit ein Weg zu Host-Root).
    # Container-Discovery und Log-Tailing laufen jetzt über den socket-proxy
    # (nur GET). Siehe config/alloy/config.alloy.
    networks: [monitoring-network, socket-proxy]
    depends_on:
      socket-proxy:
        condition: service_healthy
    userns_mode: "host"
    # KEIN /var/lib/docker/containers mehr: keine Komponente in config.alloy
    # liest die JSON-Logdateien: loki.source.docker holt die Container-Logs
    # über die Docker-API am socket-proxy. Der Mount zeigte unter userns-remap
    # ("userns-remap": "default", nixos/modules/docker.nix) ohnehin ins Leere –
    # das Datenverzeichnis des Daemons liegt dann unter
    # /var/lib/docker/100000.100000/, die Logdateien also dort.
    volumes:
      - ../../config/alloy:/etc/alloy:ro
      # BIND-MOUNT statt Named Volume, sonst startet Alloy nicht:
      #   mkdir /var/lib/alloy/data/loki.source.journal.host: permission denied
      # Das Image setzt kein USER (Dockerfile v1.18.0), der Container läuft
      # also als uid 0 – mit userns_mode: "host" als echter Host-Root. Der
      # Docker-Daemon läuft aber mit userns-remap, und ein Named Volume legt
      # er deshalb mit Eigentümer 100000:100000 an. uid 0 ist ohne
      # CAP_DAC_OVERRIDE ganz normalen Rechteprüfungen unterworfen –
      # DAC_READ_SEARCH unten umgeht nur LESE-Prüfungen (capabilities(7)).
      # Also weder Eigentümer noch Schreibrecht: mkdir scheitert, und Alloy
      # bricht den initialen Load komplett ab.
      # Der Bind-Mount gehört root:root (systemd.tmpfiles in
      # nixos/modules/docker.nix, gleiches Muster wie /var/log/traefik) –
      # damit schreibt Alloy als Eigentümer, ohne zusätzliche Capability.
      # Legt Docker das Verzeichnis an, weil tmpfiles noch nicht lief, gehört
      # es ebenfalls root:root; der Weg funktioniert also auch vor dem
      # nächsten rebuild.
      # Inhalt sind nur Lesepositionen/Journal-Cursor. Dass sie damit aus
      # /var/lib/docker/volumes und dem Medien-Backup herausfallen, ist kein
      # Verlust: nach einem Restore liest Alloy ab max_age neu.
      - /var/lib/apphost-alloy:/var/lib/alloy/data
      - /var/log:/var/log:ro
    command: run --server.http.listen-addr=0.0.0.0:12345 --storage.path=/var/lib/alloy/data /etc/alloy/config.alloy
    security_opt: ['no-new-privileges:true']
    # Wie cAdvisor: lief mit userns_mode: "host" als Host-Root mit vollem
    # Default-Capability-Satz. DAC_READ_SEARCH bleibt fürs Lesen von
    # /var/log/journal (Verzeichnis 2755 root:systemd-journal).
    cap_drop: [ALL]
    cap_add: [DAC_READ_SEARCH]
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 128M}
    labels:
      - "traefik.enable=false"
