name: apphost
volumes:
  alloy_data: {name: apphost_alloy_data}
services:
  node-exporter:
    image: prom/node-exporter:v1.11.1@sha256:e9cff4fc67b1818f8c97adb115b9f12c9a54b533de86765d4a0effc01b357205
    container_name: node-exporter
    restart: unless-stopped
    runtime: runc
    network_mode: host
    userns_mode: "host"
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    security_opt: ['no-new-privileges:true']
    cap_drop: [ALL]
    read_only: true
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 64M}
    # prom/node-exporter basiert auf busybox -> wget ist vorhanden.
    # (loki ist dagegen distroless und alloy ein Ubuntu ohne wget/curl: dort ist
    # ein exec-Healthcheck technisch unmöglich. Beide deckt stattdessen der
    # TargetDown-Alert über die Prometheus-up-Metrik ab.)
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9100/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    labels:
      - "traefik.enable=false"
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.55.1@sha256:3de2bd5203120b866d74a9b283b2ffb8ec382fbf9dc321814700c6ea6f44ec57
    container_name: cadvisor
    restart: unless-stopped
    runtime: runc
    # socket-proxy statt Docker-Socket: früher lag hier /var/run:/var/run:ro,
    # was den docker.sock mit einschloss. Das ":ro" wirkt nur auf den Mount,
    # nicht auf das Protokoll – der Container hatte damit volle Docker-API und
    # hätte sich per privilegiertem Container mit /-Mount Host-Root holen können.
    # Der socket-proxy erlaubt nur GET (POST=0), damit ist genau das ausgeschlossen.
    networks: [monitoring-network, socket-proxy]
    depends_on:
      socket-proxy:
        condition: service_healthy
    # Kein "privileged: true" mehr: cAdvisor braucht davon nur /dev/kmsg, und das
    # wird unten gezielt durchgereicht. Mit privileged war zusätzlich
    # no-new-privileges wirkungslos.
    userns_mode: "host"
    command:
      - "--docker=tcp://socket-proxy:2375"
    volumes:
      - /:/rootfs:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    devices:
      - /dev/kmsg
    security_opt: ['no-new-privileges:true']
    # cap_drop fehlte hier als einzigem Container neben alloy. Zusammen mit
    # userns_mode: "host" lief cAdvisor als echter Host-Root mit dem vollen
    # Docker-Default-Capability-Satz – bei gemountetem /:/rootfs:ro und
    # /var/lib/docker:ro ist das der Unterschied zwischen "liest Metriken" und
    # "liest /etc/shadow, .env und jedes Container-Volume".
    # DAC_READ_SEARCH bleibt, damit das Traversieren von /var/lib/docker (0710)
    # und /dev/kmsg weiter klappt; DAC_OVERRIDE (Schreibrechte) braucht es nicht.
    cap_drop: [ALL]
    cap_add: [DAC_READ_SEARCH]
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 256M}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - "traefik.enable=false"
  # redis_exporter für die immich-Valkey-Instanz (ohne Passwort, media-network)
  immich-redis-exporter:
    image: oliver006/redis_exporter:v1.88.0-alpine@sha256:db6df2026585151c2209aa1f21c8856da883cf933b0943c0e51d1f4b3acf1a8d
    container_name: immich-redis-exporter
    restart: unless-stopped
    runtime: runc
    networks: [media-network, monitoring-network]
    environment:
      REDIS_ADDR: redis://immich-redis:6379
      TZ: Europe/Berlin
    user: "65534:65534"
    security_opt: ['no-new-privileges:true']
    cap_drop: [ALL]
    read_only: true
    deploy:
      resources:
        limits: {cpus: "0.25", memory: 64M}
    labels:
      - "traefik.enable=false"
  # redis_exporter für die paperless-Valkey-Instanz (Passwort, documents-network)
  paperless-redis-exporter:
    image: oliver006/redis_exporter:v1.88.0-alpine@sha256:db6df2026585151c2209aa1f21c8856da883cf933b0943c0e51d1f4b3acf1a8d
    container_name: paperless-redis-exporter
    restart: unless-stopped
    runtime: runc
    networks: [documents-network, monitoring-network]
    environment:
      REDIS_ADDR: redis://paperless-redis:6379
      REDIS_PASSWORD: ${PAPERLESS_REDIS_PASSWORD:?}
      TZ: Europe/Berlin
    user: "65534:65534"
    security_opt: ['no-new-privileges:true']
    cap_drop: [ALL]
    read_only: true
    deploy:
      resources:
        limits: {cpus: "0.25", memory: 64M}
    labels:
      - "traefik.enable=false"
  alloy:
    image: grafana/alloy:v1.18.0@sha256:491b0578c04983fd54fe99b587b6fab4404dc46d0dc16677bd6b00cc1140b308
    container_name: alloy
    restart: unless-stopped
    runtime: runc
    # Wie cAdvisor: kein /run/docker.sock mehr (":ro" schützt einen Unix-Socket
    # nicht – das war voller Docker-API-Zugriff und damit ein Weg zu Host-Root).
    # Container-Discovery und Log-Tailing laufen jetzt über den socket-proxy
    # (nur GET). Siehe config/alloy/config.alloy.
    networks: [monitoring-network, socket-proxy]
    depends_on:
      socket-proxy:
        condition: service_healthy
    userns_mode: "host"
    volumes:
      - ../../config/alloy:/etc/alloy:ro
      - alloy_data:/var/lib/alloy/data
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: run --server.http.listen-addr=0.0.0.0:12345 --storage.path=/var/lib/alloy/data /etc/alloy/config.alloy
    security_opt: ['no-new-privileges:true']
    # Wie cAdvisor: lief mit userns_mode: "host" als Host-Root mit vollem
    # Default-Capability-Satz. DAC_READ_SEARCH bleibt fürs Lesen von
    # /var/log/journal (0640 root:systemd-journal) und
    # /var/lib/docker/containers (0710).
    cap_drop: [ALL]
    cap_add: [DAC_READ_SEARCH]
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 128M}
    labels:
      - "traefik.enable=false"
