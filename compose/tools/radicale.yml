name: apphost
services:
  # CalDAV/CardDAV-Server (Kalender + Kontakte). Sync aufs Handy via DAVx5 ->
  # erscheint dann in der nativen Samsung-Kalender-App inkl. Widget.
  # Eigene htpasswd-Basic-Auth (DAVx5 macht kein Browser-SSO), daher NICHT hinter
  # Authelia. htpasswd wird von scripts/update-secrets-radicale.sh erzeugt.
  radicale:
    image: tomsquest/docker-radicale:3.7.6.0@sha256:89fa44d02b134f0ac37cad809883327af8424499d913eec74f95085c458a93b7
    container_name: radicale
    restart: unless-stopped
    runtime: runc
    init: true
    # /data ist per Bind-Mount schon dem Radicale-UID (2999 -> Host 102999)
    # übereignet (oneshot apphost-media-dirs). Der Start-chown des Images scheitert
    # unter userns-remap trotz CAP_CHOWN, weil der Bind-Mount aus dem Host-userns
    # kommt (EPERM, Crashloop). Er ist dank Vorab-Ownership ohnehin unnötig ->
    # abschalten. Radicale läuft dann als 2999 und schreibt in sein eigenes /data.
    environment:
      - TAKE_FILE_OWNERSHIP=false
    networks:
      traefik-public: {}
    volumes:
      # Bind-Mount statt Named Volume: der Container läuft als root (userns-remap
      # = Host 100000) und macht beim Start `chown -R radicale /data`. Ein frisches
      # Named Volume gehört Host-root(0) -> im Container "nobody" -> chown scheitert
      # (EPERM, Crashloop). Über /mnt/media/radicale, vorab per setup-media-dirs.sh
      # auf Host REMAP_BASE+2999 (Radicale-UID 2999) gesetzt, ist der chown ein
      # No-op und läuft durch. Gleiches Muster wie OpenCloud.
      - /mnt/media/radicale:/data
      - ../../config/radicale/config:/config/config:ro
      - ../../secrets/radicale_users:/config/users:ro
    security_opt: ['no-new-privileges:true']
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, KILL]
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /run:size=8m
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 128M, pids: 50}
        reservations: {memory: 32M}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.radicale.rule=Host(`${RADICALE_SUBDOMAIN:-cal}.${DOMAIN}`)"
      - "traefik.http.routers.radicale.entrypoints=websecure"
      - "traefik.http.services.radicale.loadbalancer.server.port=5232"
      - "traefik.http.routers.radicale.middlewares=default-chain@file"
      - "homepage.group=Tools"
      - "homepage.name=Kalender (Radicale)"
      - "homepage.icon=radicale.png"
      - "homepage.href=https://${RADICALE_SUBDOMAIN:-cal}.${DOMAIN}"
      - "homepage.description=CalDAV / CardDAV"
