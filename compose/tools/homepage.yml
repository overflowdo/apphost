name: apphost
services:
  homepage:
    image: ghcr.io/gethomepage/homepage:v1.13.2@sha256:a0b71c8e757298d02560186bab9fbe3fc2d375c523a62cc1019177b37e48aa28
    container_name: homepage
    restart: unless-stopped
    runtime: runc
    # KEIN socket-proxy-Netz mehr. Homepage hat die Kacheln früher aus
    # `homepage.*`-Docker-Labels eingesammelt und dafür die Docker-API
    # gebraucht. Über die liefert GET /containers/{id}/json aber .Config.Env
    # jedes Containers – sämtliche Secrets des Stacks im Klartext (Details im
    # Kommentar am socket-proxy in compose/infrastructure/traefik.yml). Von den
    # vier Containern im socket-proxy-Netz war homepage der einzige, der die
    # API nur fürs Aussehen brauchte, und gleichzeitig der einzige mit
    # Ingress. Die Kacheln stehen jetzt statisch in
    # config/homepage/services.yaml.
    networks:
      traefik-public: {}
    volumes:
      - ../../config/homepage:/app/config
    environment:
      TZ: Europe/Berlin
      LOG_LEVEL: warn
      HOMEPAGE_ALLOWED_HOSTS: "*" # we handle this through traefik
      # Adressen für config/homepage/services.yaml. Hier stehen sie, weil nur
      # Compose ${DOMAIN} und die ${*_SUBDOMAIN} aus der .env auflöst; Homepage
      # ersetzt {{HOMEPAGE_VAR_...}} beim Laden der Konfiguration. Werte 1:1 aus
      # den früheren homepage.href-Labels übernommen, inklusive Defaults.
      HOMEPAGE_VAR_URL_TRAEFIK: https://traefik.${DOMAIN}
      HOMEPAGE_VAR_URL_AUTHELIA: https://${AUTHELIA_SUBDOMAIN:-auth}.${DOMAIN}
      HOMEPAGE_VAR_URL_CA: https://ca.${DOMAIN}
      HOMEPAGE_VAR_URL_BACKUP: https://${BACKUP_SUBDOMAIN:-backup}.${DOMAIN}
      HOMEPAGE_VAR_URL_IMMICH: https://${IMMICH_SUBDOMAIN:-photos}.${DOMAIN}
      HOMEPAGE_VAR_URL_JELLYFIN: https://jellyfin.${DOMAIN}
      HOMEPAGE_VAR_URL_OPENCLOUD: https://${OPENCLOUD_SUBDOMAIN:-cloud}.${DOMAIN}
      HOMEPAGE_VAR_URL_PAPERLESS: https://paperless.${DOMAIN}
      HOMEPAGE_VAR_URL_PDF: https://pdf.${DOMAIN}
      HOMEPAGE_VAR_URL_BICHON: https://${BICHON_SUBDOMAIN:-bichon}.${DOMAIN}
      HOMEPAGE_VAR_URL_NTFY: https://${NTFY_SUBDOMAIN:-ntfy}.${DOMAIN}
      HOMEPAGE_VAR_URL_VAULTWARDEN: https://${VAULTWARDEN_SUBDOMAIN:-vault}.${DOMAIN}
      HOMEPAGE_VAR_URL_RADICALE: https://${RADICALE_SUBDOMAIN:-cal}.${DOMAIN}
      HOMEPAGE_VAR_URL_GROCY: https://${GROCY_SUBDOMAIN:-grocy}.${DOMAIN}
      HOMEPAGE_VAR_URL_SPEEDTEST: https://${OPENSPEEDTEST_SUBDOMAIN:-speedtest}.${DOMAIN}
      HOMEPAGE_VAR_URL_GRAFANA: https://${GRAFANA_SUBDOMAIN:-grafana}.${DOMAIN}
      HOMEPAGE_VAR_URL_PROMETHEUS: https://prometheus.${DOMAIN}
    user: "1000:1000"
    security_opt: ['no-new-privileges:true']
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 256M}
        reservations: {memory: 64M}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.homepage.rule=Host(`${HOMEPAGE_SUBDOMAIN:-dashboard}.${DOMAIN}`) || Host(`${DOMAIN}`)"
      - "traefik.http.routers.homepage.entrypoints=websecure"
      - "traefik.http.services.homepage.loadbalancer.server.port=3000"
      - "traefik.http.routers.homepage.middlewares=authelia-chain@file"
