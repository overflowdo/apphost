name: apphost
volumes:
  vaultwarden_data: {name: apphost_vaultwarden_data}
services:
  vaultwarden:
    image: vaultwarden/server:1.37.1@sha256:ebdfe70701c60ac0c28c697e787cea767d7972940b786037b29fe0d507f821e8
    container_name: vaultwarden
    restart: unless-stopped
    runtime: runc
    networks:
      traefik-public: {}
    volumes:
      - vaultwarden_data:/data
    environment:
      TZ: Europe/Berlin
      DOMAIN: https://${VAULTWARDEN_SUBDOMAIN:-vault}.${DOMAIN}
      ADMIN_TOKEN: ${VAULTWARDEN_ADMIN_TOKEN:?}
      SIGNUPS_ALLOWED: "false"
      # INVITATIONS_ALLOWED war "true", ohne dass SMTP konfiguriert ist – die
      # Einladung konnte also gar nicht zugestellt werden. Zusammen mit
      # SIGNUPS_ALLOWED: false sah das nach einem funktionierenden Weg aus, war
      # aber keiner. Nutzer werden über das /admin-Panel angelegt:
      #   https://vault.<domain>/admin  (Token: secrets/vaultwarden_admin_token.txt)
      # Wer echte Einladungen per Mail will, muss SMTP_* ergänzen und das hier
      # wieder auf "true" setzen.
      INVITATIONS_ALLOWED: "false"
      LOG_LEVEL: warn
    security_opt: ['no-new-privileges:true']
    cap_drop: [ALL]
    tmpfs:
      - /tmp:size=64m,mode=1777
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 256M}
        reservations: {memory: 64M}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:80/alive"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.vaultwarden.rule=Host(`${VAULTWARDEN_SUBDOMAIN:-vault}.${DOMAIN}`)"
      - "traefik.http.routers.vaultwarden.entrypoints=websecure"
      - "traefik.http.services.vaultwarden.loadbalancer.server.port=80"
      - "traefik.http.routers.vaultwarden.middlewares=default-chain@file"
      # Eigener Router nur für den Login-Endpunkt: dort greift das strenge
      # Rate-Limit (5/s), ohne das Laden des Web-Vaults (Dutzende Assets) zu
      # drosseln. Vaultwarden hat keinen eigenen Brute-Force-Schutz; das
      # fail2ban-Jail fängt zusätzlich die 400er dieses Pfades ab
      # (siehe nixos/modules/security.nix).
      - "traefik.http.routers.vaultwarden-auth.rule=Host(`${VAULTWARDEN_SUBDOMAIN:-vault}.${DOMAIN}`) && PathPrefix(`/identity/connect/token`)"
      - "traefik.http.routers.vaultwarden-auth.entrypoints=websecure"
      - "traefik.http.routers.vaultwarden-auth.priority=100"
      - "traefik.http.routers.vaultwarden-auth.service=vaultwarden"
      - "traefik.http.routers.vaultwarden-auth.middlewares=auth-endpoint-chain@file"
      # /admin zusätzlich hinter Authelia mit Zwei-Faktor-Pflicht.
      #
      # Das Panel kann Konten löschen, Einladungen verschicken, 2FA einzelner
      # Nutzer abschalten und die Konfiguration einsehen – davor stand bisher
      # allein ADMIN_TOKEN, ein statisches Bearer-Token ohne zweiten Faktor,
      # ohne strenges Rate-Limit und ohne fail2ban (der Filter zählt nur die
      # 400er von /identity/connect/token, Fehlversuche auf /admin waren
      # unsichtbar). Während Prometheus und das Traefik-Dashboard two_factor
      # verlangen, hing die mächtigste Oberfläche im Stack an einer einzigen
      # Schranke. Genau diese Asymmetrie ist der Punkt – das Token selbst ist
      # als Argon2-Hash über 32 Zufalls-Hex nicht ratbar.
      #
      # priority 110 > 100 (vaultwarden-auth) > Standard, damit der
      # spezifischste Router zuerst greift. Bitwarden-Clients berühren /admin
      # nie, für sie ändert sich nichts. Die Zwei-Faktor-Regel steht in
      # config/authelia/configuration.yml (resources: ^/admin).
      - "traefik.http.routers.vaultwarden-admin.rule=Host(`${VAULTWARDEN_SUBDOMAIN:-vault}.${DOMAIN}`) && PathPrefix(`/admin`)"
      - "traefik.http.routers.vaultwarden-admin.entrypoints=websecure"
      - "traefik.http.routers.vaultwarden-admin.priority=110"
      - "traefik.http.routers.vaultwarden-admin.service=vaultwarden"
      - "traefik.http.routers.vaultwarden-admin.middlewares=authelia-admin-chain@file"
