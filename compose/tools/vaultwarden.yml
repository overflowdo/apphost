name: apphost
volumes:
  vaultwarden_data: {name: apphost_vaultwarden_data}
services:
  vaultwarden:
    image: vaultwarden/server:1.32.4@sha256:7271b8ceb729f9b46144c800125813dcc8d16bb6874217c48e59b22b45e47d7d
    container_name: vaultwarden
    restart: unless-stopped
    runtime: runc
    networks:
      traefik-public: {}
    volumes:
      - vaultwarden_data:/data
    environment:
      TZ: Europe/Berlin
      DOMAIN: https://${VAULTWARDEN_SUBDOMAIN:-vault}.${DOMAIN}
      ADMIN_TOKEN: ${VAULTWARDEN_ADMIN_TOKEN:?}
      SIGNUPS_ALLOWED: "false"
      # INVITATIONS_ALLOWED war "true", ohne dass SMTP konfiguriert ist – die
      # Einladung konnte also gar nicht zugestellt werden. Zusammen mit
      # SIGNUPS_ALLOWED: false sah das nach einem funktionierenden Weg aus, war
      # aber keiner. Nutzer werden über das /admin-Panel angelegt:
      #   https://vault.<domain>/admin  (Token: secrets/vaultwarden_admin_token.txt)
      # Wer echte Einladungen per Mail will, muss SMTP_* ergänzen und das hier
      # wieder auf "true" setzen.
      INVITATIONS_ALLOWED: "false"
      LOG_LEVEL: warn
    security_opt: ['no-new-privileges:true']
    cap_drop: [ALL]
    tmpfs:
      - /tmp:size=64m,mode=1777
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 256M}
        reservations: {memory: 64M}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:80/alive"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.vaultwarden.rule=Host(`${VAULTWARDEN_SUBDOMAIN:-vault}.${DOMAIN}`)"
      - "traefik.http.routers.vaultwarden.entrypoints=websecure"
      - "traefik.http.services.vaultwarden.loadbalancer.server.port=80"
      - "traefik.http.routers.vaultwarden.middlewares=default-chain@file"
      - "homepage.group=Tools"
      - "homepage.name=Vaultwarden"
      - "homepage.icon=vaultwarden.png"
      - "homepage.href=https://${VAULTWARDEN_SUBDOMAIN:-vault}.${DOMAIN}"
