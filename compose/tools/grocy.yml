name: apphost
volumes:
  grocy_config: {name: apphost_grocy_config}
services:
  # Vorratsverwaltung (Kühlschrank/Regal/Keller): Bestand mit Standorten,
  # Mindestbestand -> automatische Einkaufsliste, Verbrauch, MHD, Barcode.
  # Hinter Authelia-SSO (authelia-chain) mit ECHTEM Single-Sign-on: Grocy vertraut
  # dem Remote-User-Header von Authelia (config/grocy/config.php ->
  # ReverseProxyAuthMiddleware), es gibt KEINEN zweiten Grocy-Login mehr. Der
  # Authelia-Login (custom Passwort) ist die einzige Anmeldung.
  grocy:
    image: lscr.io/linuxserver/grocy:4.6.0@sha256:35b2c85b1238f8249c9b349fb03619d1915917e61b2e4bff580729ec87397b4c
    container_name: grocy
    restart: unless-stopped
    runtime: runc
    # NICHT in traefik-public: Grocy vertraut dem Remote-User-Header ohne
    # IP-Whitelist (config/grocy/config.php -> ReverseProxyAuthMiddleware). In
    # einem Netz mit ~20 weiteren Containern ist
    #   curl -H 'Remote-User: admin' http://grocy/
    # aus jedem davon ein vollwertiger Admin-Login – an Traefik, an
    # strip-remote-user und an Authelia vorbei. Genau das Risiko, das bei
    # Paperless durch PAPERLESS_ENABLE_HTTP_REMOTE_USER: "false" geschlossen
    # wurde; bei Grocy geht das nicht, weil der Header dort DIE Anmeldung ist.
    # Deshalb ein eigenes Netz, in dem nur Traefik und Grocy stehen.
    networks:
      sso-header-network: {}
    volumes:
      - grocy_config:/config
      # Feature-Flags declarativ: blendet nicht benötigte Module aus (Rezepte,
      # Hausarbeiten, Aufgaben, Batterien, Geräte, Kalender). Grocy lädt diese
      # Datei zuerst, dann config-dist.php für alle übrigen Defaults. read-only,
      # damit sie die Quelle der Wahrheit im Repo bleibt.
      - ../../config/grocy/config.php:/config/data/config.php:ro
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Europe/Berlin
    # LSIO-Image: init läuft als root und lässt dann auf PUID fallen -> KEIN
    # cap_drop ALL (würde den Start brechen). no-new-privileges ist ok.
    security_opt: ['no-new-privileges:true']
    deploy:
      resources:
        limits: {cpus: "1.0", memory: 256M}
        reservations: {memory: 64M}
    healthcheck:
      # Mit aktivem Reverse-Proxy-Auth weist Grocy Requests ohne Remote-User-Header
      # ab -> der Healthcheck muss den Header mitschicken (nur localhost im Container).
      test: ["CMD-SHELL", "curl -fsS -H 'Remote-User: admin' http://127.0.0.1:80/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grocy.rule=Host(`${GROCY_SUBDOMAIN:-grocy}.${DOMAIN}`)"
      - "traefik.http.routers.grocy.entrypoints=websecure"
      # Pflicht, seit Grocy nicht mehr in traefik-public hängt: der
      # Docker-Provider nimmt sonst das global gesetzte Default-Netz
      # (providers.docker.network) und findet dort keine IP für den Container.
      - "traefik.docker.network=sso-header-network"
      - "traefik.http.services.grocy.loadbalancer.server.port=80"
      - "traefik.http.routers.grocy.middlewares=authelia-chain@file"
      - "homepage.group=Tools"
      - "homepage.name=Grocy"
      - "homepage.icon=grocy.png"
      - "homepage.href=https://${GROCY_SUBDOMAIN:-grocy}.${DOMAIN}"
      - "homepage.description=Vorratsverwaltung"
