name: apphost
services:
  openspeedtest:
    image: openspeedtest/latest:v2.0.8@sha256:1127de0693c36bcf8c297c73d09891df8ec243680d027a6b6fab13fa0954ff46
    container_name: openspeedtest
    restart: unless-stopped
    runtime: runc
    networks:
      traefik-public: {}
    environment:
      TZ: Europe/Berlin
    security_opt: ['no-new-privileges:true']
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
      - /var/log/nginx:size=64m,mode=0777
      - /var/cache/nginx:size=128m,mode=0777
      - /run:size=32m,mode=0755
    deploy:
      resources:
        limits: {cpus: "2.0", memory: 128M}
        reservations: {memory: 32M}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.speedtest.rule=Host(`${OPENSPEEDTEST_SUBDOMAIN:-speedtest}.${DOMAIN}`)"
      - "traefik.http.routers.speedtest.entrypoints=websecure"
      - "traefik.http.services.speedtest.loadbalancer.server.port=3000"
      - "traefik.http.routers.speedtest.middlewares=authelia-chain@file"
