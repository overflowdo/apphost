name: apphost
services:
  collabora:
    image: collabora/code:25.04.10.3.1@sha256:a51dd5d1741dea5d19f49d9997de2c321bf582076015ec4015941f3f00a5f4c0
    container_name: collabora
    restart: unless-stopped
    runtime: runc
    networks:
      traefik-public: {}
    environment:
      domain: "${OPENCLOUD_SUBDOMAIN:-cloud}\\.${DOMAIN}"
      aliasgroup1: "https://${WOPISERVER_SUBDOMAIN:-wopi}.${DOMAIN}:443"
      # admin_console.enable=false: unter
      # office.<domain>/browser/dist/admin/admin.html liegt sonst Collaboras
      # Admin-Konsole, abgesichert allein durch COLLABORA_ADMIN_PASSWORD.
      # Gebraucht wird sie hier von niemandem – OpenCloud spricht nur WOPI.
      extra_params: |
        --o:ssl.enable=false \
        --o:ssl.ssl_verification=true \
        --o:ssl.termination=true \
        --o:welcome.enable=false \
        --o:net.frame_ancestors=https://${OPENCLOUD_SUBDOMAIN:-cloud}.${DOMAIN} \
        --o:net.lok_allow.host[14]=https://${OPENCLOUD_SUBDOMAIN:-cloud}.${DOMAIN} \
        --o:home_mode.enable=false \
        --o:admin_console.enable=false
      DONT_GEN_SSL_CERT: "YES"
      username: ${COLLABORA_ADMIN_USER:-admin}
      password: ${COLLABORA_ADMIN_PASSWORD:?}
    volumes:
      - /run/current-system/sw/share/X11/fonts/:/usr/share/fonts/truetype/more:ro
    # Collabora sandboxt jeden Dokument-Prozess SELBST (eigene Mount-/PID-
    # Namespaces + chroot pro Dokument) und braucht dafür SYS_ADMIN, SYS_CHROOT
    # und MKNOD. Vorher stand hier nur "cap_add: [SYS_ADMIN]" OHNE cap_drop –
    # der Container hatte also zusätzlich den kompletten Docker-Default-Satz
    # (NET_RAW, NET_BIND_SERVICE, KILL, AUDIT_WRITE, …). Jetzt: alles weg,
    # nur das Nötige zurück.
    cap_drop: [ALL]
    cap_add: [SYS_ADMIN, SYS_CHROOT, MKNOD, CHOWN, FOWNER, SETGID, SETUID, DAC_OVERRIDE]
    # seccomp/apparmor bleiben unconfined: die Default-Profile blockieren genau
    # die mount()/clone()-Aufrufe, mit denen Collabora seine eigene Sandbox baut.
    # KEIN no-new-privileges: coolwsd erteilt seinen Hilfsprozessen (coolforkit)
    # Datei-Capabilities; mit NNP schlägt das fehl und der Editor startet nicht.
    # Damit ist das hier weiterhin der am schwächsten isolierte Container im
    # Stack – er hängt in traefik-public, also im selben Netz wie alle anderen
    # Web-Dienste. Wer das enger haben will, muss ihn in ein eigenes Netz legen
    # (nur wopiserver/opencloud + traefik dürfen ihn erreichen).
    security_opt:
      - seccomp=unconfined
      - apparmor:unconfined
    tmpfs:
      - /tmp:size=2g,mode=1777
      - /run:size=64m,mode=0755
    deploy:
      resources:
        limits: {cpus: "4.0", memory: 2G}
        reservations: {memory: 512M}
    ulimits:
      nofile: {soft: 65536, hard: 65536}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9980/hosting/discovery"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 60s
    entrypoint: ['/bin/bash', '-c']
    command: ['coolconfig generate-proof-key && /start-collabora-online.sh']
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.collabora.rule=Host(`${COLLABORA_SUBDOMAIN:-office}.${DOMAIN}`)"
      - "traefik.http.routers.collabora.entrypoints=websecure"
      - "traefik.http.services.collabora.loadbalancer.server.port=9980"
      # Eigene Header-Middleware statt default-chain@file. Collabora war bislang
      # der einzige Dienst ganz OHNE Middleware -> kein HSTS, kein nosniff, keine
      # Referrer-Policy. default-chain geht hier aber nicht: security-headers
      # setzt X-Frame-Options und COEP: require-corp, und OpenCloud bindet
      # office.<domain> als CROSS-ORIGIN-Iframe ein (cloud.<domain>) – beides
      # würde den Editor blockieren. Frame-Schutz übernimmt stattdessen die von
      # Collabora selbst gesetzte CSP (--o:net.frame_ancestors, siehe oben).
      # Als Docker-Label (nicht in dynamic/middlewares.yml), weil dort ${DOMAIN}
      # nicht interpoliert wird.
      - "traefik.http.middlewares.collabora-headers.headers.stsSeconds=63072000"
      - "traefik.http.middlewares.collabora-headers.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.collabora-headers.headers.stsPreload=true"
      - "traefik.http.middlewares.collabora-headers.headers.forceSTSHeader=true"
      - "traefik.http.middlewares.collabora-headers.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.collabora-headers.headers.browserXssFilter=true"
      - "traefik.http.middlewares.collabora-headers.headers.referrerPolicy=strict-origin-when-cross-origin"
      - "traefik.http.middlewares.collabora-headers.headers.customResponseHeaders.X-Robots-Tag=noindex, nofollow, noarchive"
      - "traefik.http.middlewares.collabora-headers.headers.customResponseHeaders.Server="
      - "traefik.http.middlewares.collabora-headers.headers.customResponseHeaders.X-Powered-By="
      - "traefik.http.middlewares.collabora-headers.headers.customRequestHeaders.X-Forwarded-Proto=https"
      # rate-limit/in-flight standen hier als einzigem Router im Stack nicht davor.
      # Collabora ist gleichzeitig der am schwächsten isolierte Container
      # (seccomp/apparmor unconfined, SYS_ADMIN) – ausgerechnet der war also
      # ungedrosselt erreichbar. OpenCloud läuft mit denselben zwei
      # Middlewares, der Editor kommt damit aus.
      - "traefik.http.routers.collabora.middlewares=rate-limit@file,in-flight@file,collabora-headers,compress@file"
