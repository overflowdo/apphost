name: apphost
volumes:
  paperless_data: {name: apphost_paperless_data}
  paperless_consume: {name: apphost_paperless_consume}
  paperless_export: {name: apphost_paperless_export}
  paperless_redis: {name: apphost_paperless_redis}
services:
  paperless:
    image: ghcr.io/paperless-ngx/paperless-ngx:2.20.15@sha256:6c86cad803970ea782683a8e80e7403444c5bf3cf70de63b4d3c8e87500db92f
    container_name: paperless
    restart: unless-stopped
    runtime: runc
    depends_on:
      paperless-redis:
        condition: service_healthy
    networks:
      documents-network:
        aliases: [paperless]
      traefik-public: {}
    volumes:
      - paperless_data:/usr/src/paperless/data
      - /mnt/media/paperless:/usr/src/paperless/media
      - paperless_consume:/usr/src/paperless/consume
      - paperless_export:/usr/src/paperless/export
      # Bundle statt nur der lokalen CA: REQUESTS_CA_BUNDLE ERSETZT den
      # Truststore von python-requests. Mit dem Bundle (System-CAs + lokale CA,
      # erzeugt von nixos/modules/local-ca.nix) funktioniert der OIDC-Token-Call
      # sowohl lokal als auch mit einem Let's-Encrypt-Zertifikat.
      - /var/lib/apphost-ca/ca-bundle.crt:/certs/ca-bundle.crt:ro
    env_file:
      - ../../secrets/oidc-paperless.env
    environment:
      PAPERLESS_REDIS: redis://:${PAPERLESS_REDIS_PASSWORD:?}@paperless-redis:6379
      PAPERLESS_SECRET_KEY: ${PAPERLESS_SECRET_KEY:?}
      PAPERLESS_URL: https://paperless.${DOMAIN}
      # OIDC-Login gegen Authelia (python-requests), siehe Mount oben
      REQUESTS_CA_BUNDLE: /certs/ca-bundle.crt
      PAPERLESS_ALLOWED_HOSTS: "*"
      PAPERLESS_CSRF_TRUSTED_ORIGINS: "https://paperless.${DOMAIN}"
      # Django TRUSTED_PROXIES vergleicht gegen die IP der Gegenstelle, nicht
      # gegen einen Hostnamen -> hier die feste Traefik-IP aus traefik-public
      # (compose/infrastructure/traefik.yml: ipv4_address 172.23.1.2).
      PAPERLESS_TRUSTED_PROXIES: 172.23.1.2
      # Remote-User-Auth ist AUS. Sie stammte aus der Tor-Zeit (ForwardAuth über
      # tor-authelia-chain); Tor ist raus. Paperless kennt – anders als Grafana
      # (GF_AUTH_PROXY_WHITELIST) – KEINE IP-Whitelist für den Header. Paperless
      # hängt aber in traefik-public zusammen mit ~18 weiteren Containern: jeder
      # davon könnte http://paperless:8000/ direkt mit "Remote-User: admin"
      # aufrufen und wäre – dank SOCIAL_AUTO_SIGNUP notfalls als frisch
      # angelegter Nutzer – voll eingeloggt. strip-remote-user am Router greift
      # nur für Clients, die über Traefik kommen. Login läuft ausschließlich
      # über OIDC gegen Authelia.
      PAPERLESS_ENABLE_HTTP_REMOTE_USER: "false"
      PAPERLESS_OCR_LANGUAGE: ${PAPERLESS_OCR_LANGUAGE:-deu+eng}
      PAPERLESS_SESSION_COOKIE_SECURE: "true"
      PAPERLESS_CSRF_COOKIE_SECURE: "true"
      PAPERLESS_ENABLE_UPDATE_CHECK: "false"
      PAPERLESS_TIME_ZONE: Europe/Berlin
      USERMAP_UID: 1000
      USERMAP_GID: 1000
      # Auto-Signup gilt jetzt nur noch für OIDC-Logins (allauth), die Authelia
      # zuvor authentifiziert hat – nicht mehr für einen gespooften Header.
      PAPERLESS_SOCIAL_AUTO_SIGNUP: "true"
      PAPERLESS_DISABLE_REGULAR_LOGIN: "true"
    security_opt: ['no-new-privileges:true']
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID, CHOWN, DAC_OVERRIDE]
    tmpfs:
      - /tmp:size=1g,mode=1777
    deploy:
      resources:
        limits: {cpus: "4.0", memory: 2G}
        reservations: {memory: 256M}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 60s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.paperless.rule=Host(`paperless.${DOMAIN}`)"
      - "traefik.http.routers.paperless.entrypoints=websecure"
      - "traefik.http.services.paperless.loadbalancer.server.port=8000"
      - "traefik.http.routers.paperless.middlewares=strip-remote-user@file,default-chain@file"
      - "homepage.group=Dokumente"
      - "homepage.name=Paperless-NGX"
      - "homepage.icon=paperless-ngx.png"
      - "homepage.href=https://paperless.${DOMAIN}"
  paperless-redis:
    image: valkey/valkey:9-alpine@sha256:ee91f7a174ac4d6a6b0685b3a60e321f0a9dbbb691f9b0e285be2ba1d1be8328
    container_name: paperless-redis
    restart: unless-stopped
    runtime: runc
    networks: [documents-network]
    volumes:
      - paperless_redis:/data
    command: ["valkey-server", "--save", "60", "1", "--loglevel", "warning", "--maxmemory", "128mb", "--requirepass", "${PAPERLESS_REDIS_PASSWORD:?}"]
    security_opt: ['no-new-privileges:true']
    cap_drop: [ALL]
    user: "999:999"
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 128M}
    healthcheck:
      test: ["CMD", "valkey-cli", "-a", "${PAPERLESS_REDIS_PASSWORD:?}", "ping"]
      interval: 15s
      timeout: 5s
      retries: 3
    labels:
      - "traefik.enable=false"
