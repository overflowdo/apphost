name: apphost
services:
  bento-pdf:
    image: ghcr.io/alam00000/bentopdf-simple:2.8.7@sha256:ba67d44f07ec0d2d636c945eef1c186f71bceda3d11b1e9809d7dbfbbaaacfa4
    container_name: bento-pdf
    restart: unless-stopped
    runtime: runc
    networks:
      traefik-public: {}
    environment:
      TZ: Europe/Berlin
    security_opt: ['no-new-privileges:true']
    cap_drop: [ALL]
    tmpfs:
      - /var/cache/nginx:size=64m,mode=1777
      - /var/run:size=8m,mode=0755
      - /etc/nginx/tmp:size=8m,mode=1777
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 64M}
        reservations: {memory: 16M}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.bento-pdf.rule=Host(`pdf.${DOMAIN}`)"
      - "traefik.http.routers.bento-pdf.entrypoints=websecure"
      - "traefik.http.services.bento-pdf.loadbalancer.server.port=8080"
      - "traefik.http.routers.bento-pdf.middlewares=authelia-chain@file"
