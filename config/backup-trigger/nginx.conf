# Backup-Auslöser + Statusanzeige.
#
# Bewusst KEIN eigenes Webhook-Image: der Dienst braucht genau eine Fähigkeit –
# eine leere Datei in genau einem Verzeichnis anlegen. Das kann das
# nginx-Unprivileged-Image, das im Stack ohnehin schon steckt (identischer
# Digest wie ca-download), mit dem eingebauten DAV-Modul. Damit gibt es kein
# zusätzliches Image zu pflegen und keinen Prozess, der irgendetwas ausführt.
#
# Die eigentliche Arbeit macht NICHT dieser Container, sondern eine
# systemd.path-Unit auf dem Host, die auf das Auftauchen von
# /var/lib/apphost-backup/web/hook/run wartet (nixos/modules/backup.nix).
# Der Inhalt der Datei wird nie gelesen – es gibt also nichts zu injizieren.
# Der schlimmste Fall bei einem übernommenen Container ist: das Backup läuft
# öfter als nötig.
#
# PRÜFEN vor dem ersten Start (das DAV-Modul ist in den offiziellen
# nginx-Images einkompiliert, aber wenn es fehlt, startet nginx gar nicht):
#   docker exec backup-trigger nginx -V 2>&1 | tr ' ' '\n' | grep dav
#   -> muss "--with-http_dav_module" zeigen
worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 64;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    off;
    server_tokens off;
    sendfile      on;

    # Auf demselben Dateisystem wie das Ziel: nginx puffert den PUT-Body und
    # verschiebt ihn dann per rename() an seinen Platz. Über eine
    # Dateisystemgrenze hinweg scheitert das.
    client_body_temp_path /srv/hook/.tmp;
    client_max_body_size  1k;

    server {
        listen 8080;

        # Statusdatei. Schreibt die Backup-Unit in der VM
        # (nixos/modules/backup.nix), hier wird sie nur ausgeliefert.
        # no-store, damit die Seite nach einem Lauf nicht den alten Stand zeigt.
        location = /status.json {
            root /srv;
            add_header Cache-Control "no-store" always;
            # Vor dem ersten Backup gibt es sie noch nicht – dann eine leere
            # Antwort statt einer 404-Fehlerseite, die das JS nicht parsen kann.
            try_files /status.json =204;
        }

        # Der Auslöser. Nur PUT, alles andere wird abgewiesen; ein GET (und
        # damit auch ein Browser-Prefetch) kann hier nichts starten.
        location = /hook/run {
            root /srv;
            dav_methods PUT;
            dav_access user:rw;
            create_full_put_path off;
            limit_except PUT { deny all; }
        }

        location / {
            root  /usr/share/nginx/html;
            index index.html;
        }
    }
}
