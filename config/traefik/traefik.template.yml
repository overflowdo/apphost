# Senden von Nutzungsstatistiken deaktivieren
global:
  checkNewVersion: false
  sendAnonymousUsage: false
api:
  dashboard: true
  debug: false
  insecure: false
ping:
  entryPoint: "traefik-internal"
# Entry Points
#
# HINWEIS zu encodedCharacters: Hier stand an jedem Entrypoint ein Block, der
# ALLE Schutzschalter auf einmal aufhob (allowEncodedSlash/BackSlash/
# NullCharacter/Semicolon/Percent/QuestionMark/Hash = true). Damit reichte
# Traefik %2f, %5c, %00, %25 & Co. unverändert an die Backends durch – genau die
# Bausteine für Path-Traversal und Normalisierungs-Tricks bei allem, was
# pfadbasiert entscheidet. Jetzt gelten wieder die Traefik-Defaults (blockiert).
# Falls ein Dienst nachweislich einen davon braucht (Kandidat: WebDAV in
# OpenCloud/Collabora mit kodierten Slashes), gezielt EINEN Schalter am
# websecure-Entrypoint wieder aktivieren – nicht wieder alle.
#
# forwardedHeaders.trustedIPs: nur noch Loopback. Vor Traefik steht kein
# weiterer Proxy – LAN-Clients kommen per DNAT mit ihrer echten Adresse an,
# Container mit ihrer Container-Adresse. In beiden Fällen ist die Peer-Adresse
# die richtige Quelle, ein vom Client mitgeschicktes X-Forwarded-For ist es nie.
# Stand hier 192.168.0.0/16, durfte jedes LAN-Gerät seine Client-IP frei setzen;
# mit 172.16.0.0/12 durfte das jeder der ~20 Container. Beides hebelt Authelias
# Brute-Force-Regulation aus und fälscht das Access-Log, das fail2ban liest.
entryPoints:
  # HTTP -> Redirect auf HTTPS
  web:
    address: ":8081"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
    forwardedHeaders:
      insecure: false
      trustedIPs: ["127.0.0.1/8", "::1/128"]
  # HTTPS – TLS 1.3 + HTTP/3 (QUIC/UDP)
  websecure:
    address: ":8443"
    http3:
      advertisedPort: 443
    http:
      tls:
        options: strict@file
        certResolver: letsencrypt
        domains:
          - main: "${DOMAIN}"
            sans:
              - "*.${DOMAIN}"
    forwardedHeaders:
      insecure: false
      trustedIPs: ["127.0.0.1/8", "::1/128"]
    transport:
      respondingTimeouts:
        readTimeout: "30s"
        writeTimeout: "30s"
        idleTimeout: "120s"
  traefik-internal:
    address: ":8080"
# Provider
providers:
  docker:
    endpoint: "tcp://socket-proxy:2375"
    exposedByDefault: false
    network: "traefik-public"
    watch: true
  file:
    directory: "/etc/traefik/dynamic"
    watch: true
certificatesResolvers:
  # Produktions-Zertifikat (Let's Encrypt Prod)
  letsencrypt:
    acme:
      email: "${ACME_EMAIL}"
      storage: "/certs/acme.json"
      caServer: "https://acme-v02.api.letsencrypt.org/directory"
      # DNS-01 Challenge
      dnsChallenge:
        provider: ${ACME_DNS_PROVIDER}
        propagation:
          delayBeforeChecks: "30s"
        resolvers:
          - "1.1.1.1:53"
          - "9.9.9.9:53"
  # Staging (zum Testen ohne Rate-Limits bei LE)
  letsencrypt_staging:
    acme:
      email: "${ACME_EMAIL}"
      storage: "/certs/acme-staging.json"
      caServer: "https://acme-staging-v02.api.letsencrypt.org/directory"
      # DNS-01 Challenge
      dnsChallenge:
        provider: ${ACME_DNS_PROVIDER}
        propagation:
          delayBeforeChecks: "30s"
        resolvers: ["1.1.1.1:53", "9.9.9.9:53"]
# Logging
log:
  level: "WARN"
  format: "json"
accessLog:
  # Zusätzlich in eine Datei, damit das fail2ban-Jail "traefik-auth"
  # (nixos/modules/security.nix) überhaupt etwas zu lesen hat. Reines stdout war
  # für fail2ban nicht erreichbar -> der Brute-Force-Schutz lief ins Leere.
  # Host-Verzeichnis: /var/log/traefik (angelegt via nixos/modules/docker.nix,
  # Rotation via services.logrotate in nixos/modules/security.nix).
  filePath: "/var/log/traefik/access.log"
  format: "json"
  bufferingSize: 100
  filters:
    # KEIN statusCodes-Filter mehr. Vorher wurden nur 400-599 protokolliert –
    # für fail2ban reichte das, für die Frage "wer hat wann welche Datei
    # geholt" gab es damit gar keine Datenbasis, weder in der Datei noch in
    # Loki. Rotation ist eingerichtet (logrotate, 7 Tage, siehe
    # nixos/modules/security.nix), die Menge ist also begrenzt.
    retryAttempts: true
  fields:
    headers:
      defaultMode: drop
      names:
        User-Agent: keep
        X-Forwarded-For: keep
        Authorization: drop
        Cookie: drop
# Metrics
metrics:
  prometheus:
    addEntryPointsLabels: true
    addRoutersLabels: true
    addServicesLabels: true
    entryPoint: "traefik-internal"
