# Traefik – TLS-Konfiguration BSI TR-02102-2 konform
tls:
  options:
    # Intermediate – TLS 1.2 + TLS 1.3 (BSI TR-02102-2 konform)
    # Für maximale Kompatibilität (support für ältere Clients wenn nötig aktivierbar)
    intermediate:
      minVersion: "VersionTLS12"
      maxVersion: "VersionTLS13"
      # sniStrict AUS für den lokalen self-signed Betrieb: ohne ACME-Zertifikat
      # für ${DOMAIN} muss Traefik bei nicht-passender SNI sein Default-Zertifikat
      # ausliefern. sniStrict: true würde das blocken -> Browser bekommt ein
      # TLS-'unrecognized_name'-Alert (Firefox: SSL_ERROR_UNRECOGNIZED_NAME_ALERT).
      # Für einen öffentlichen Betrieb mit echten Zertifikaten kann das wieder true.
      sniStrict: false
      cipherSuites:
        # TLS 1.3 Ciphers (automatisch, keine explizite Konfiguration nötig)
        # TLS 1.2 Ciphers (BSI TR-02102-2 Empfehlung):
        - "TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256"
        - "TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256"
        - "TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384"
        - "TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384"
        - "TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305_SHA256"
        - "TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305_SHA256"
      curvePreferences:
        - "X25519"
        - "CurveP256"
        - "CurveP384"
    strict:
      minVersion: "VersionTLS13"
      # sniStrict AUS für self-signed Fallback (Begründung siehe "intermediate").
      # Der websecure-Entrypoint referenziert diese Optionen (strict@file).
      sniStrict: false
    default:
      minVersion: "VersionTLS13"
      sniStrict: false
  # Default Store – von der lokalen CA signiertes Zertifikat.
  # nixos/modules/local-ca.nix erzeugt es unter /var/lib/apphost-ca; in den
  # Traefik-Container als /certs-local gemountet (compose/infrastructure/traefik.yml).
  stores:
    default:
      defaultCertificate:
        certFile: /certs-local/apphost.crt
        keyFile: /certs-local/apphost.key
  certificates:
    - certFile: /certs-local/apphost.crt
      keyFile: /certs-local/apphost.key
