# Traefik Middlewares
http:
  middlewares:
    security-headers:
      headers:
        # HSTS – Browser erzwingen HTTPS für 2 Jahre, inkl. Subdomains
        stsSeconds: 63072000
        stsIncludeSubdomains: true
        stsPreload: true
        forceSTSHeader: true
        # Frame-Protection
        frameDeny: true
        customFrameOptionsValue: "SAMEORIGIN" # Überschreibt frameDeny für Iframes innerhalb der eigenen Domain
        # Content-Type Sniffing verhindern
        contentTypeNosniff: true
        # XSS-Protection (für alte Browser)
        browserXssFilter: true
        # Referrer-Policy
        referrerPolicy: "strict-origin-when-cross-origin"
        # Permissions-Policy
        permissionsPolicy: "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"
        # Eigene Sicherheits-Headers
        customResponseHeaders:
          X-Robots-Tag: "noindex, nofollow, noarchive"
          Server: "" # Server-Banner verstecken
          X-Powered-By: "" # Tech-Stack verstecken
          Cross-Origin-Opener-Policy: "same-origin"
          Cross-Origin-Embedder-Policy: "require-corp"
          Cross-Origin-Resource-Policy: "same-site"
          X-XSS-Protection: "1; mode=block"
        # Entferne sensible Request-Header
        customRequestHeaders:
          X-Forwarded-Proto: "https"
          X-Real-IP: ""
    csp-self:
      headers:
        contentSecurityPolicy: >-
          default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' wss: https:; media-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests;
    # Compress – GZIP/Brotli für alle Responses
    compress:
      compress:
        excludedContentTypes:
          - "text/event-stream" # Server-Sent Events nicht komprimieren
        minResponseBodyBytes: 1024
    # Redirect www -> non-www
    redirect-www:
      redirectRegex:
        regex: "^https://www\\.(.*)"
        replacement: "https://${1}"
        permanent: true
    # ForwardAuth mit Authelia
    # Schützt Services ohne eigenes OIDC
    forward-auth:
      forwardAuth:
        address: "http://authelia:9091/api/authz/forward-auth"
        trustForwardHeader: true
        # Ohne Limit Möglichkeit von DoS/Speicher-Erschöpfung
        maxResponseBodySize: 65536
        authResponseHeaders:
          - "Remote-User"
          - "Remote-Groups"
          - "Remote-Name"
          - "Remote-Email"
    # strip-remote-user entfernt vom CLIENT gesetzte Auth-Header. Alles, was dem
    # Remote-User-Header vertraut (aktuell nur noch Grocy, config/grocy/config.php),
    # darf ihn niemals vom Client bekommen – er muss aus forward-auth stammen.
    strip-remote-user:
      headers:
        customRequestHeaders:
          Remote-User: ""
          Remote-Groups: ""
          Remote-Name: ""
          Remote-Email: ""
    # OpenCloud bettet Collabora als Cross-Origin-Iframe (office.<domain>) ein.
    # Mit COEP: require-corp müsste dieser Frame (und alle seine Ressourcen)
    # einen CORP-Header liefern. Dadurch können externe Ressourcen oft nicht richtig geladen werden, die hier benötigt werden. 
    opencloud-headers:
      headers:
        stsSeconds: 63072000
        stsIncludeSubdomains: true
        stsPreload: true
        forceSTSHeader: true
        frameDeny: true
        customFrameOptionsValue: "SAMEORIGIN"
        contentTypeNosniff: true
        browserXssFilter: true
        referrerPolicy: "strict-origin-when-cross-origin"
        permissionsPolicy: "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"
        customResponseHeaders:
          X-Robots-Tag: "noindex, nofollow, noarchive"
          Server: ""
          X-Powered-By: ""
          Cross-Origin-Opener-Policy: "same-origin"
          Cross-Origin-Resource-Policy: "same-site"
          X-XSS-Protection: "1; mode=block"
        customRequestHeaders:
          X-Forwarded-Proto: "https"
          X-Real-IP: ""
    # Middleware-Ketten (kombinierte Middlewares)
    # Standard-Kette für öffentliche Services mit eigener Auth
    default-chain:
      chain:
        middlewares:
          - security-headers
          - compress
    # OpenCloud-Kette – wie default-chain, aber ohne COEP (siehe opencloud-headers)
    opencloud-chain:
      chain:
        middlewares:
          - opencloud-headers
          - compress
    # Authelia-Kette – ForwardAuth für Services ohne eigenes OIDC.
    # strip-remote-user MUSS vor forward-auth stehen: es löscht client-gesetzte
    # Remote-User/-Groups/-Name/-Email-Header, danach setzt forward-auth die von
    # Authelia authentifizierten Werte (authResponseHeaders). Ohne das Strippen
    # könnte ein eingeloggter Nutzer den Header spoofen – kritisch, seit Grocy
    # dem Remote-User-Header für sein SSO vertraut (config/grocy/config.php).
    authelia-chain:
      chain:
        middlewares:
          - strip-remote-user
          - forward-auth
          - security-headers
          - compress
