# Prometheus Alert-Regeln
groups:
  # Host-Alarme
  - name: host
    interval: 30s
    rules:
      - alert: HostHighCPULoad
        expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Host CPU-Last hoch ({{ $labels.instance }})"
          description: "CPU-Auslastung: {{ printf \"%.2f\" $value }}%"
      - alert: HostOutOfMemory
        expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes * 100 < 10
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Wenig RAM verfügbar ({{ $labels.instance }})"
          description: "Nur {{ printf \"%.2f\" $value }}% RAM verfügbar"
      # /mnt/media hatte gar keinen Alert – dort liegen Immich-Fotos,
      # Paperless-Dokumente, OpenCloud-Dateien und Radicale-Kalender. Läuft die
      # Platte voll, fällt das sonst erst durch scheiternde Uploads auf.
      - alert: MediaDiskSpaceLow
        expr: (node_filesystem_avail_bytes{mountpoint="/mnt/media"} / node_filesystem_size_bytes{mountpoint="/mnt/media"}) * 100 < 15
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Wenig Platz auf der Datenplatte /mnt/media"
          description: "{{ printf \"%.2f\" $value }}% frei – betrifft Immich, Paperless, OpenCloud und Radicale."
      - alert: MediaDiskSpaceCritical
        expr: (node_filesystem_avail_bytes{mountpoint="/mnt/media"} / node_filesystem_size_bytes{mountpoint="/mnt/media"}) * 100 < 5
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "KRITISCH: Datenplatte /mnt/media fast voll"
      # Die Bulk-Platte ist per nofail gemountet – fällt sie ganz weg, gibt es
      # die Serien oben nicht mehr und absent() schlägt an.
      - alert: MediaDiskMissing
        expr: absent(node_filesystem_size_bytes{mountpoint="/mnt/media"})
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "/mnt/media ist nicht gemountet"
          description: "nofail lässt den Host trotzdem booten; Container schreiben dann auf die Systemplatte."
      - alert: HostDiskSpaceLow
        expr: (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) * 100 < 15
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Wenig Festplattenspeicher ({{ $labels.instance }})"
          description: "{{ printf \"%.2f\" $value }}% freier Speicher auf /"
      - alert: HostDiskSpaceCritical
        expr: (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) * 100 < 5
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "KRITISCH: Kein Festplattenspeicher ({{ $labels.instance }})"
      - alert: HostHighLoad
        expr: node_load1 > 8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "System-Load hoch: {{ $value }}"
  # Scrape-Targets. Deckt alles ab, was Prometheus anfasst – also auch die
  # Dienste, denen ein Docker-Healthcheck technisch nicht möglich ist
  # (loki = distroless, alloy = Ubuntu ohne HTTP-Client).
  - name: targets
    rules:
      - alert: TargetDown
        expr: up == 0
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "Prometheus-Target nicht erreichbar: {{ $labels.job }} ({{ $labels.instance }})"
          description: "Der Scrape schlägt seit mindestens 3 Minuten fehl."
  # Container-Alarme
  - name: containers
    rules:
      # Setzt voraus, dass cAdvisor seine Docker-Factory registrieren konnte
      # (socket-proxy braucht dafür INFO=1) – sonst fehlt das name-Label an
      # allen container_*-Metriken.
      #
      # Diese Regel erkennt NUR den Totalausfall (cAdvisor meldet gar keine
      # Container mehr), nicht den Ausfall eines einzelnen Dienstes – dafür
      # ist ContainerVanished darunter zuständig. Umbenannt, weil der alte Name
      # "ContainerDown" bei einem absent() über alle Container das Gegenteil
      # dessen versprach, was er tut.
      - alert: NoContainerMetrics
        expr: absent(container_last_seen{name!=""})
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "cAdvisor meldet keinerlei Container mehr"
          description: "Entweder ist cAdvisor selbst weg oder seine Docker-Integration (socket-proxy INFO=1)."
      # Ausfall eines EINZELNEN Containers.
      #
      # NICHT "time() - container_last_seen > 120": Prometheus markiert eine
      # Serie als stale, sobald sie aus einem Scrape verschwindet – nicht erst
      # nach fünf Minuten. Stirbt ein Container, nimmt cAdvisor ihn aus
      # /metrics, und beim nächsten Scrape gibt es container_last_seen fuer
      # ihn gar nicht mehr. Die Differenz wird also nie 120, der Ausdruck
      # liefert einen leeren Vektor und der Alert feuert nie – dieselbe
      # Fehlerklasse wie beim ursprünglichen absent().
      #
      # Diese Form vergleicht stattdessen "war vor 10 Minuten da" mit "ist
      # jetzt da" und braucht dafür keine hartkodierte Container-Liste.
      # Bekannter Nebeneffekt: ein bewusst entfernter Container meldet sich
      # einmalig für 10 Minuten.
      - alert: ContainerVanished
        expr: |
          count by (name) (container_last_seen{name!=""} offset 10m)
            unless
          count by (name) (container_last_seen{name!=""})
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Container läuft nicht mehr: {{ $labels.name }}"
          description: "War vor 10 Minuten noch da, wird von cAdvisor jetzt nicht mehr gemeldet."
      # Ein Container, der dauerhaft neu startet, verschwindet nie lange genug
      # für die Regel oben. ContainerRestarting unten deckt diesen Fall ab.
      - alert: ContainerHighMemory
        expr: (container_memory_usage_bytes{name!=""} / container_spec_memory_limit_bytes{name!=""}) * 100 > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Container hoher RAM-Verbrauch: {{ $labels.name }}"
          description: "{{ printf \"%.2f\" $value }}% des Limits"
      - alert: ContainerRestarting
        expr: rate(container_restart_count{name!=""}[15m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Container wird häufig neu gestartet: {{ $labels.name }}"
  # Traefik-Alarme
  - name: traefik
    rules:
      - alert: TraefikHighErrorRate
        expr: rate(traefik_router_requests_total{code=~"5.."}[5m]) / rate(traefik_router_requests_total[5m]) > 0.05
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Traefik hohe Fehlerrate: {{ $labels.router }}"
      # traefik_backend_server_up war der Metrikname aus Traefik v1 – unter v3
      # heißt sie traefik_service_server_up. Der Alert konnte also nie feuern.
      - alert: TraefikServiceDown
        expr: traefik_service_server_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Traefik Service nicht erreichbar: {{ $labels.service }}"
