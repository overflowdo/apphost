# =============================================================================
# Homepage – Service-Konfiguration
#
# Diese Datei ist die EINZIGE Quelle der Dienste-Kacheln. Vorher kamen sie aus
# `homepage.*`-Docker-Labels, die Homepage über den socket-proxy eingesammelt
# hat. Dafür brauchte homepage Zugriff auf die Docker-API – und darüber liefert
# `GET /containers/{id}/json` das komplette .Config.Env jedes Containers, also
# sämtliche Secrets des Stacks im Klartext (siehe den Kommentar am socket-proxy
# in compose/infrastructure/traefik.yml). Für ein Dashboard, das Kacheln
# anzeigt, ist das ein schlechter Tausch. Homepage hängt deshalb nicht mehr im
# socket-proxy-Netz.
#
# Die Adressen kommen als {{HOMEPAGE_VAR_URL_*}} aus der Umgebung; gesetzt
# werden sie in compose/tools/homepage.yml, wo ${DOMAIN} und die
# ${*_SUBDOMAIN}-Variablen aus der .env noch aufgelöst werden. Homepage ersetzt
# die Platzhalter beim Laden dieser Datei (src/utils/config/service-helpers.js,
# servicesFromConfig -> substituteEnvironmentVars).
#
# NEUEN DIENST ERGÄNZEN: hier eine Kachel eintragen UND die passende
# HOMEPAGE_VAR_URL_*-Zeile in compose/tools/homepage.yml. Ein `homepage.*`-Label
# an der Compose-Datei bewirkt nichts mehr.
#
# Docs: https://gethomepage.dev/configs/services/
# =============================================================================

- Infrastruktur:
    - Traefik:
        icon: traefik.png
        href: "{{HOMEPAGE_VAR_URL_TRAEFIK}}"
        description: Reverse Proxy
    - Authelia:
        icon: authelia.png
        href: "{{HOMEPAGE_VAR_URL_AUTHELIA}}"
        description: Single Sign-on
    - CA-Zertifikat:
        icon: mdi-certificate
        href: "{{HOMEPAGE_VAR_URL_CA}}"
        description: Lokale CA zum Import
    - Archivierung:
        icon: mdi-harddisk
        href: "{{HOMEPAGE_VAR_URL_BACKUP}}"
        description: Backup starten & Status
        # Der Teil, der täglich etwas wert ist: Backup-Alter sehen, ohne die
        # Seite zu öffnen. Stand vorher als homepage.widget.*-Labels an
        # compose/tools/backup-trigger.yml und wäre mit der Docker-Discovery
        # verschwunden. Die Felder liefert scripts/media-backup.sh fertig
        # formatiert nach /var/lib/apphost-backup/web/status.json; homepage und
        # backup-trigger hängen beide in traefik-public, der Name löst also auf.
        widget:
          type: customapi
          url: http://backup-trigger:8080/status.json
          mappings:
            - field: age_days
              label: Tage her
            - field: disk
              label: Platte
            - field: duration_text
              label: Dauer
            - field: used_percent
              label: "% belegt"

