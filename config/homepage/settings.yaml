title: AppHost
description: Privates Homelab-Dashboard
language: de
theme: dark
color: slate
headerStyle: clean
hideVersion: true
# Die Statusquelle ist jetzt siteMonitor je Kachel (config/homepage/services.yaml),
# nicht mehr die Docker-Anbindung. Homepage fragt dafür die INTERNEN
# Container-Adressen ab, nicht die öffentlichen: ein HEAD auf
# https://<dienst>.<domain> liefe gegen Authelia und meldete jeden Dienst als
# 302, und über die öffentliche DNS-Auflösung zurück (Hairpin) obendrein. Die
# Doku empfiehlt für genau diesen Fall ebenfalls die interne Adresse.
statusStyle: "dot"
