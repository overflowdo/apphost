global:
  resolve_timeout: 5m
route:
  # Standard-Receiver
  receiver: "ntfy-critical"
  group_by: ["alertname", "cluster", "service"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 12h
  routes:
    # Kritische Alerts: sofort via Ntfy
    - match:
        severity: critical
      receiver: ntfy-critical
      repeat_interval: 1h
      continue: true
    # Warnungen: gebündelt alle 5 Minuten
    - match:
        severity: warning
      receiver: ntfy-warning
      group_wait: 1m
      group_interval: 10m
      repeat_interval: 6h
      continue: true
    # Null route Watchdog-Alerts
    - match:
        alertname: Watchdog
      receiver: "null"
# HINWEIS zur Darstellung: "?template=alertmanager" nutzt das in ntfy ab 2.9
# eingebaute Alertmanager-Template. Ohne das postet Alertmanager seine komplette
# Alert-Gruppe als JSON, und ntfy veröffentlicht diesen String unverändert –
# auf dem Handy kam also ein roher JSON-Blob an. Das früher hier stehende
# "templates: /etc/alertmanager/templates/*.tmpl" half nicht: das Verzeichnis
# existiert nicht, und webhook_configs nutzen Alertmanager-Templates ohnehin nicht.
#
# HINWEIS zur Authentifizierung gegen ntfy:
# Hier stand vorher 'bearer_token: "${NTFY_ADMIN_TOKEN}"'. Das konnte nie
# funktionieren: Alertmanager expandiert KEINE Umgebungsvariablen in seiner
# Konfiguration, der Token war also literal der String "${NTFY_ADMIN_TOKEN}" –
# und NTFY_ADMIN_TOKEN war ohnehin nirgends im Repo definiert. ntfy läuft mit
# auth-default-access: deny-all + require-login: true, jede Benachrichtigung
# scheiterte damit still an 401/403: es kam KEIN einziger Alarm an.
# Richtig ist Basic-Auth mit dem User, den scripts/update-secrets-ntfy.sh
# ohnehin anlegt (inkl. ACL rw auf apphost-critical/apphost-warnings). Das
# Passwort kommt aus secrets/alertmanager_ntfy_password (dorthin geschrieben von
# update-secrets-ntfy.sh, gemountet nach /run/secrets/ntfy_password,
# siehe compose/monitoring/alertmanager.yml).
#
# "priority=high" nur beim kritischen Topic: scripts/notify-failure.sh schickt
# systemd-Fehlschläge ebenfalls mit hoher Priorität – ohne den Parameter
# kämen ausgerechnet die kritischen Prometheus-Alerts mit Standardprioritaet
# an und gingen auf dem Handy unter. Warnungen bleiben bewusst normal.
receivers:
  # Null-Receiver (für stille Alerts)
  - name: "null"
  # Kritische Alerts (hohe Priorität)
  - name: ntfy-critical
    webhook_configs:
      - url: "http://ntfy:80/apphost-critical?template=alertmanager&priority=high"
        send_resolved: true
        http_config:
          basic_auth:
            username: alertmanager
            password_file: /run/secrets/ntfy_password
  # Warnungen (normale Priorität)
  - name: ntfy-warning
    webhook_configs:
      - url: "http://ntfy:80/apphost-warnings?template=alertmanager"
        send_resolved: true
        http_config:
          basic_auth:
            username: alertmanager
            password_file: /run/secrets/ntfy_password
inhibit_rules:
  # Kritische Alerts inhibieren Warnungen des gleichen Services
  - source_match:
      severity: critical
    target_match:
      severity: warning
    equal:
      - alertname
      - cluster
      - service
